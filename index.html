<style>
/* Layout: station-signage list. Sticky search header, floor-grouped rows, floor + wing badges like elevator plates. */
:root{
  --bg:#eef2f8; --surface:#ffffff; --ink:#14213a; --muted:#5a6882; --line:#d8e0ec;
  --accent:#2f6fd6; --accent-ink:#ffffff; --accent-soft:#e3ecfb;
  --center:#1d3f86; --east:#0e7c7f; --star:#d79a00; --warn-bg:#fff4dc; --warn-ink:#7a5200; --danger:#c0362c;
  --f-display:"Barlow Condensed","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-ja:"Zen Kaku Gothic New","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","Zen Kaku Gothic New",system-ui,sans-serif;
  --r:10px; --wing-ink:#ffffff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1322; --surface:#141e33; --ink:#e5ecf8; --muted:#94a3bd; --line:#253350;
  --accent:#6da5ff; --accent-ink:#0c1322; --accent-soft:#1b2a48;
  --center:#8eaeff; --east:#45c4c6; --star:#f2b928; --warn-bg:#3a2e12; --warn-ink:#f3d58f; --danger:#ff7b70; --wing-ink:#0c1322; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1322; --surface:#141e33; --ink:#e5ecf8; --muted:#94a3bd; --line:#253350;
  --accent:#6da5ff; --accent-ink:#0c1322; --accent-soft:#1b2a48;
  --center:#8eaeff; --east:#45c4c6; --star:#f2b928; --warn-bg:#3a2e12; --warn-ink:#f3d58f; --danger:#ff7b70; --wing-ink:#0c1322; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand .mark{width:28px;height:28px;flex:none}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;line-height:1}
.brand h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0;margin-top:3px}
.brand .sp{flex:1}
.pill-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.pill-btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.search{position:relative}
.search input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:var(--r);padding:11px 40px 11px 40px;font-size:16px}
.search input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:18px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip .n{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-size:13px;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:13px}
.filters .fav-toggle{margin-left:auto}

.notice{display:flex;gap:8px;align-items:flex-start;background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r);padding:10px 12px;font-size:13px;margin-top:14px}
.notice b{font-weight:700}
.meta-line{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin:14px 2px 4px}
.meta-line .count{font-variant-numeric:tabular-nums}

main{padding-bottom:120px}
.floor{margin-top:18px}
.floor-h{display:flex;align-items:baseline;gap:10px;padding:0 2px 6px;border-bottom:2px solid var(--ink)}
.floor-h .fl{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;letter-spacing:.01em}
.floor-h .hint{font-size:12.5px;color:var(--muted)}
.floor-h .cnt{margin-left:auto;font-family:var(--f-display);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.row .main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;display:flex;gap:12px;align-items:center}
.wing{flex:none;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--wing-ink)}
.wing.C{background:var(--center)} .wing.E{background:var(--east)}
.names{min-width:0;flex:1}
.ja{font-family:var(--f-ja);font-weight:700;font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.names>span{display:block}
.alt{font-family:var(--f-ja);font-size:13px;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--muted);line-height:1.45;overflow-wrap:anywhere;margin-top:2px}
.sub .tag{display:inline-block;font-size:11.5px;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 5px;margin-right:4px;font-weight:500}
.sub .temp{background:var(--warn-bg);color:var(--warn-ink)}
.star{flex:none;border:0;background:none;width:36px;height:36px;border-radius:50%;color:var(--line);font-size:20px;line-height:1}
.star[aria-pressed="true"]{color:var(--star)}
.edit-btn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13px}
.empty{padding:40px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:28px;padding:12px 2px;border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .wing{width:20px;height:20px;font-size:12px;border-radius:5px}
footer.foot{font-size:12.5px;color:var(--muted);padding:4px 2px 20px;display:flex;flex-direction:column;gap:4px}
footer.foot a{color:var(--accent)}
footer.foot div{margin-bottom:6px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:10px;box-shadow:0 -6px 20px rgba(10,20,40,.08)}
.bar .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .msg{flex:1;min-width:160px;font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}

.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px))}

.sheet .plate{display:flex;gap:8px;align-items:center;margin:10px 0 14px}
.sheet .plate .fl{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}

.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .req::after{content:" *";color:var(--danger)}
.err{color:var(--danger);font-size:13px}
.confirm{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:10px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

</style>

<script id="main" data-keep>
(function(){
  "use strict";
  // Capture the authored page source before anything renders, for "export HTML".
  var SOURCE = Array.prototype.map.call(document.querySelectorAll("[data-keep]"), function(el){
    return el.id === "shop-data" ? "__DATA_SLOT__" : el.outerHTML;
  });
  var RESET = (function(){ var s = document.head && document.head.querySelector("style"); return s ? s.textContent : ""; })();

  var CATS = [
    ["all","全部"],["fashion","服飾"],["beauty","美妝"],["living","生活雜貨"],
    ["dining","餐廳咖啡"],["souvenir","伴手禮・食品"],["other","其他"]
  ];
  var CAT_NAME = {}; CATS.forEach(function(c){ CAT_NAME[c[0]] = c[1]; });
  var FLOORS = ["B1F","1F","2F","3F","4F","5F","6F","7F","9F"];
  var FLOOR_HINT = {"6F":"Center 6F 為餐廳樓層","7F":"電影院","9F":"頂樓庭園"};
  var LOCAL_KEY = "sp-shops-local-v2", FAV_KEY = "sp-favs-v1", MODE_KEY = "sp-mode-v1";

  function store(get, key, val){ try{ if(get) return localStorage.getItem(key); localStorage.setItem(key,val); }catch(e){ return null; } }
  function storeDel(key){ try{ localStorage.removeItem(key); }catch(e){} }

  var embedded = JSON.parse(document.getElementById("shop-data").textContent);
  var DATA = embedded, dirty = 0, localMode = false;

  // A newer copy kept in this browser (saved where publishing isn't possible) wins over the embedded data.
  (function(){
    var raw = store(true, LOCAL_KEY); if(!raw) return;
    try{
      var loc = JSON.parse(raw);
      if(loc && loc.meta && loc.meta.updatedAt > embedded.meta.updatedAt){ DATA = loc; localMode = true; }
      else storeDel(LOCAL_KEY);
    }catch(e){ storeDel(LOCAL_KEY); }
  })();

  var favs = {};
  try{ (JSON.parse(store(true,FAV_KEY)||"[]")||[]).forEach(function(id){ favs[id]=1; }); }catch(e){}

  var state = { q:"", cat:"all", wing:"all", floor:"all", fav:false, edit:false, mode:(store(true,MODE_KEY)||"zh") };
  if(["zh","ja","both"].indexOf(state.mode)<0) state.mode="zh";
  var $ = function(id){ return document.getElementById(id); };

  // ---------- search normalisation: full/half width, case, katakana→hiragana, punctuation ----------
  function norm(s){
    s = (s||"").normalize("NFKC").toLowerCase();
    s = s.replace(/[ァ-ヶ]/g, function(ch){ return String.fromCharCode(ch.charCodeAt(0)-0x60); });
    return s.replace(/[\s・･\-‐－ー—_.,'’&＆\/／()（）「」【】!！?？:：。、]+/g,"");
  }
  function indexOf(s){
    return norm([s.ja,s.en,s.zh,s.d,CAT_NAME[s.c],s.note,s.f,s.b==="C"?"center 中心館":"east 東館"].join(" "));
  }

  // ---------- render ----------
  function esc(t){ return String(t==null?"":t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function floorRank(f){ var i = FLOORS.indexOf(f); return i<0?99:i; }

  function filtered(ignoreCat){
    var q = norm(state.q);
    return DATA.shops.filter(function(s){
      if(!ignoreCat && state.cat!=="all" && s.c!==state.cat) return false;
      if(state.wing!=="all" && s.b!==state.wing) return false;
      if(state.floor!=="all" && s.f!==state.floor) return false;
      if(state.fav && !favs[s.id]) return false;
      if(q && indexOf(s).indexOf(q)<0) return false;
      return true;
    });
  }

  function renderChips(){
    var base = filtered(true), n = {all:base.length};
    base.forEach(function(s){ n[s.c]=(n[s.c]||0)+1; });
    $("cats").innerHTML = CATS.map(function(c){
      return '<button class="chip" data-c="'+c[0]+'" aria-pressed="'+(state.cat===c[0])+'">'+c[1]+'<span class="n">'+(n[c[0]]||0)+'</span></button>';
    }).join("");
  }

  function renderFloorSel(){
    var used = {}; DATA.shops.forEach(function(s){ used[s.f]=1; });
    var fl = FLOORS.filter(function(f){return used[f];}).concat(Object.keys(used).filter(function(f){return FLOORS.indexOf(f)<0;}).sort());
    $("floorSel").innerHTML = '<option value="all">全部樓層</option>' + fl.map(function(f){ return '<option value="'+esc(f)+'"'+(state.floor===f?" selected":"")+'>'+esc(f)+'</option>'; }).join("");
  }

  function names(s){
    var main, alt;
    if(state.mode==="ja"){ main = s.ja; alt = s.en; }
    else if(state.mode==="both"){ main = s.en || s.ja; alt = [s.en ? s.ja : "", s.zh].filter(Boolean).join("・"); }
    else { main = s.en || s.zh || s.ja; alt = (s.zh && s.zh!==main) ? s.zh : ""; }
    return { main: main, alt: alt };
  }
  function rowHTML(s){
    var n = names(s);
    var intro = (s.note ? '<span class="tag temp">'+esc(s.note)+'</span>' : '')
      + (state.cat==="all" ? '<span class="tag">'+esc(CAT_NAME[s.c]||"")+'</span>' : '') + esc(s.d||"");
    return '<li class="row">'
      + '<button class="main" data-open="'+esc(s.id)+'"><span class="wing '+s.b+'" title="'+(s.b==="C"?"Center":"East")+'">'+s.b+'</span>'
      + '<span class="names"><span class="ja">'+esc(n.main)+'</span>'
      + (n.alt ? '<span class="alt">'+esc(n.alt)+'</span>' : '')
      + '<span class="sub">'+intro+'</span></span></button>'
      + (state.edit ? '<button class="edit-btn" data-edit="'+esc(s.id)+'">修改</button>'
                    : '<button class="star" data-fav="'+esc(s.id)+'" aria-pressed="'+(!!favs[s.id])+'" aria-label="收藏 '+esc(s.ja)+'">★</button>')
      + '</li>';
  }

  function render(){
    renderChips();
    var list = filtered(false).sort(function(a,b){
      return floorRank(a.f)-floorRank(b.f) || (a.b<b.b?-1:a.b>b.b?1:0) || names(a).main.localeCompare(names(b).main,"ja");
    });
    $("count").textContent = "顯示 " + list.length + " / " + DATA.shops.length + " 間";
    if(!list.length){
      var why = state.fav && !Object.keys(favs).length ? "還沒有收藏的店。點店名旁的 ★ 加入收藏。" :
        state.q ? "找不到「"+state.q+"」。試試片假名、英文，或改選「全部」分類與樓層。" : "這個條件下沒有店鋪。";
      $("results").innerHTML = '<div class="empty"><b>沒有符合的店鋪</b>'+esc(why)+'</div>';
      return;
    }
    var html = "", cur = null, buf = [];
    function flush(){
      if(!cur) return;
      html += '<section class="floor"><div class="floor-h"><span class="fl">'+esc(cur)+'</span>'
        + (FLOOR_HINT[cur]?'<span class="hint">'+FLOOR_HINT[cur]+'</span>':'')
        + '<span class="cnt">'+buf.length+' 間</span></div><ul class="list">'+buf.map(rowHTML).join("")+'</ul></section>';
    }
    list.forEach(function(s){ if(s.f!==cur){ flush(); cur=s.f; buf=[]; } buf.push(s); });
    flush();
    $("results").innerHTML = html;
  }

  function renderMeta(){
    var m = DATA.meta||{};
    $("notice").hidden = !m.notice; $("noticeText").textContent = m.notice||"";
    $("hours").textContent = m.hours||"";
    $("srcLine").textContent = "資料更新：" + (m.updated||"—") + (m.edited ? "（含手動修改）" : "") + "｜來源：" + (m.source||"");
  }

  function renderBar(){
    var show = state.edit || dirty>0 || localMode;
    $("bar").hidden = !show;
    $("addBtn").hidden = !state.edit;
    var msg;
    if(dirty) msg = dirty + " 項修改尚未儲存";
    else if(localMode) msg = "正在使用這台裝置上的修改版本";
    else msg = "編輯模式：點「修改」更正資料";
    $("barMsg").textContent = msg;
    $("saveBtn").disabled = !dirty;
  }

  // ---------- sheet ----------
  var lastFocus = null;
  function openSheet(html, label){
    lastFocus = document.activeElement;
    $("sheet").innerHTML = html; $("sheet").setAttribute("aria-label", label||"");
    $("sheetBg").hidden = false;
    var f = $("sheet").querySelector("input,button,select,textarea"); if(f) f.focus();
  }
  function closeSheet(){ $("sheetBg").hidden = true; $("sheet").innerHTML=""; if(lastFocus && lastFocus.focus) lastFocus.focus(); }

  function findShop(id){ for(var i=0;i<DATA.shops.length;i++) if(DATA.shops[i].id===id) return DATA.shops[i]; return null; }

  function showDetail(id){
    var s = findShop(id); if(!s) return;
    var official = /^\d+$/.test(s.id) ? 'https://www.stellarplace.net/shop_detail/'+s.id : "";
    openSheet(
      '<h2>'+esc(s.en || s.ja)+'</h2>'
      + '<div class="alt">'+esc([s.en ? s.ja : "", s.zh].filter(Boolean).join("・"))+'</div>'
      + (s.d ? '<p style="margin:10px 0 0">'+esc(s.d)+'</p>' : '')
      + '<div class="plate"><span class="wing '+s.b+'">'+s.b+'</span><span class="fl">'+esc(s.f)+'</span><span class="sub">'+(s.b==="C"?"Center 中心館":"East 東館")+'</span></div>'
      + '<dl class="dl"><dt>分類</dt><dd>'+esc(CAT_NAME[s.c]||s.c)+'</dd>'
      + (s.tel?'<dt>電話</dt><dd class="tel">'+esc(s.tel)+'</dd>':'')
      + (s.note?'<dt>備註</dt><dd>'+esc(s.note)+'</dd>':'')
      + '</dl><div class="actions">'
      + (official?'<a class="btn" href="'+official+'" target="_blank" rel="noopener">官方店鋪頁</a>':'')
      + '<button class="btn" data-fav="'+esc(s.id)+'" aria-pressed="'+(!!favs[s.id])+'">'+(favs[s.id]?"★ 已收藏":"☆ 收藏")+'</button>'
      + '<button class="btn" data-edit="'+esc(s.id)+'">修改資料</button>'
      + '<button class="btn" data-close>關閉</button></div>', s.ja);
  }

  function opt(v,label,cur){ return '<option value="'+v+'"'+(v===cur?" selected":"")+'>'+label+'</option>'; }
  function showEdit(id){
    var s = id ? findShop(id) : {id:"",b:"C",f:"1F",c:"fashion",ja:"",en:"",zh:"",d:"",tel:"",note:""};
    if(!s) return;
    openSheet(
      '<h2>'+(id?"修改店鋪":"新增店鋪")+'</h2><p class="sub" style="margin:0 0 12px">改完按「套用」，再按下方「儲存」才會保存。</p>'
      + '<form class="form" id="editForm" novalidate>'
      + '<label><span class="req">日文店名（官方寫法）</span><input id="f_ja" value="'+esc(s.ja)+'" required></label>'
      + '<div class="two"><label>品牌名（招牌寫法）<input id="f_en" value="'+esc(s.en)+'"></label><label>中文名<input id="f_zh" value="'+esc(s.zh)+'"></label></div>'
      + '<div class="two"><label>館別<select id="f_b">'+opt("C","Center",s.b)+opt("E","East",s.b)+'</select></label>'
      + '<label><span class="req">樓層</span><input id="f_f" value="'+esc(s.f)+'" placeholder="例：B1F、6F" required></label></div>'
      + '<label>分類<select id="f_c">'+CATS.slice(1).map(function(c){return opt(c[0],c[1],s.c);}).join("")+'</select></label>'
      + '<label>一句話介紹<input id="f_d" value="'+esc(s.d)+'" placeholder="例：北海道人氣迴轉壽司"></label>'
      + '<label>電話<input id="f_tel" value="'+esc(s.tel)+'" inputmode="tel"></label>'
      + '<label>備註（期間限定、改裝中等）<input id="f_note" value="'+esc(s.note)+'"></label>'
      + '<div class="err" id="f_err" hidden></div>'
      + '<div class="actions"><button type="submit" class="btn primary">套用</button><button type="button" class="btn" data-close>取消</button>'
      + (id?'<button type="button" class="btn danger" id="delAsk">刪除</button>':'')
      + '</div><div id="delZone"></div></form>', id?"修改店鋪":"新增店鋪");
    var form = $("editForm");
    form.addEventListener("submit", function(e){
      e.preventDefault();
      var v = function(k){ return $("f_"+k).value.trim(); };
      var floor = v("f").toUpperCase().replace(/^B(\d)$/,"B$1F").replace(/^(\d)$/,"$1F");
      if(!v("ja")){ showErr("請填寫店名。"); return; }
      if(!/^B?\d+F$/.test(floor)){ showErr("樓層請寫成 B1F 或 3F 的格式。"); return; }
      var rec = { id: id || ("u"+Date.now().toString(36)), b:v("b"), f:floor, c:v("c"), ja:v("ja"), en:v("en"), zh:v("zh"), d:v("d"), tel:v("tel") };
      if(v("note")) rec.note = v("note");
      if(id){ var i = DATA.shops.indexOf(s); DATA.shops[i] = rec; } else DATA.shops.push(rec);
      markDirty(); closeSheet(); renderFloorSel(); render();
    });
    var ask = $("delAsk");
    if(ask) ask.addEventListener("click", function(){
      $("delZone").innerHTML = '<div class="confirm">確定刪除「'+esc(s.ja)+'」？<button type="button" class="btn danger" id="delYes">刪除</button><button type="button" class="btn" id="delNo">保留</button></div>';
      $("delYes").addEventListener("click", function(){ DATA.shops.splice(DATA.shops.indexOf(s),1); markDirty(); closeSheet(); renderFloorSel(); render(); });
      $("delNo").addEventListener("click", function(){ $("delZone").innerHTML=""; });
    });
  }
  function showErr(t){ var e=$("f_err"); e.textContent=t; e.hidden=false; }

  function showNoticeEdit(){
    var m = DATA.meta;
    openSheet('<h2>頁面公告與營業時間</h2><form class="form" id="metaForm" novalidate>'
      + '<label>公告（留空則不顯示）<textarea id="m_notice" rows="3">'+esc(m.notice||"")+'</textarea></label>'
      + '<label>營業時間<input id="m_hours" value="'+esc(m.hours||"")+'"></label>'
      + '<div class="actions"><button type="submit" class="btn primary">套用</button><button type="button" class="btn" data-close>取消</button></div></form>', "公告");
    $("metaForm").addEventListener("submit", function(e){
      e.preventDefault(); m.notice = $("m_notice").value.trim(); m.hours = $("m_hours").value.trim();
      markDirty(); closeSheet(); renderMeta();
    });
  }

  function markDirty(){ dirty++; renderBar(); }

  // ---------- saving ----------
  var artP = (window.claude && window.claude.use) ? window.claude.use("artifact").catch(function(){return null;}) : Promise.resolve(null);
  var dlP  = (window.claude && window.claude.use) ? window.claude.use("downloads").catch(function(){return null;}) : Promise.resolve(null);

  function stamp(){
    var d = new Date(), p = function(n){return (n<10?"0":"")+n;};
    DATA.meta.updated = d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
    DATA.meta.updatedAt = d.toISOString();
    DATA.meta.edited = true;
  }
  function saveLocal(){ store(false, LOCAL_KEY, JSON.stringify(DATA)); localMode = true; }

  function setMsg(t){ $("barMsg").textContent = t; }

  $("saveBtn").addEventListener("click", function(){
    var btn = this; btn.disabled = true; setMsg("儲存中…");
    stamp();
    artP.then(function(art){
      if(!art) throw {code:"no_artifact"};
      return art.publish({"shops.json": {content: JSON.stringify(DATA), contentType:"application/json"}});
    }).then(function(){
      dirty = 0; localMode = false; storeDel(LOCAL_KEY); renderMeta(); renderBar();
      setMsg("已儲存，在任何裝置打開這個頁面都會看到更新。");
    }).catch(function(err){
      var code = err && err.code;
      if(code==="conflict"){ setMsg("有人同時儲存了另一個版本，頁面會重新載入，請再做一次這次的修改。"); return; }
      saveLocal(); dirty = 0; renderMeta(); renderBar();
      setMsg(code==="no_artifact"
        ? "已存在這台手機／電腦。要讓所有人看到，按「匯出資料檔」再上傳到 GitHub 取代 shops.json。"
        : "這裡無法發布修改（可能是唯讀分享），已先存在這台裝置的瀏覽器。");
    });
  });

  function buildHTML(){
    var json = JSON.stringify(DATA).replace(/</g,"\\u003c");
    var body = SOURCE.map(function(part){
      return part === "__DATA_SLOT__" ? '<script type="application/json" id="shop-data" data-keep>'+json+'<\/script>' : part;
    }).join("\n");
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'
      + RESET + '</style></head><body>' + body + '</body></html>';
  }

  $("exportBtn").addEventListener("click", function(){
    var json = JSON.stringify(DATA, null, 1), name = "shops.json";
    try{
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([json],{type:"application/json"})); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setMsg("已下載 shops.json。上傳到 GitHub 取代舊檔，所有人重新打開就會看到更新。");
    }catch(e){ setMsg("這個瀏覽器無法下載檔案，請改用電腦操作。"); }
  });
  if(false) $("exportBtn").addEventListener("click", function(){
    var html = buildHTML(), name = "stellar-place.html";
    dlP.then(function(dl){
      if(dl) return dl.save({filename:name, data:html}).then(function(){ setMsg("已匯出 "+name+"，可直接上傳到 GitHub。"); });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([html],{type:"text/html"})); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setMsg("已下載 "+name+"。");
    }).catch(function(err){
      setMsg(err && err.code==="declined" ? "已取消匯出。" : "這裡無法下載檔案。");
    });
  });

  // ---------- events ----------
  var qt;
  $("q").addEventListener("input", function(){
    state.q = this.value; $("qClear").hidden = !this.value;
    clearTimeout(qt); qt = setTimeout(render, 60);
  });
  $("qClear").addEventListener("click", function(){ $("q").value=""; state.q=""; this.hidden=true; render(); $("q").focus(); });
  $("cats").addEventListener("click", function(e){ var b=e.target.closest("[data-c]"); if(!b) return; state.cat=b.dataset.c; render(); });
  $("wings").addEventListener("click", function(e){
    var b=e.target.closest("[data-w]"); if(!b) return; state.wing=b.dataset.w;
    Array.prototype.forEach.call(this.children,function(x){x.setAttribute("aria-pressed", String(x===b));}); render();
  });
  function syncModes(){ Array.prototype.forEach.call($("modes").children,function(x){x.setAttribute("aria-pressed", String(x.dataset.m===state.mode));}); }
  $("modes").addEventListener("click", function(e){
    var b=e.target.closest("[data-m]"); if(!b) return; state.mode=b.dataset.m; store(false,MODE_KEY,state.mode); syncModes(); render();
  });
  syncModes();
  $("floorSel").addEventListener("change", function(){ state.floor=this.value; render(); });
  $("favToggle").addEventListener("click", function(){ state.fav=!state.fav; this.setAttribute("aria-pressed",String(state.fav)); render(); });
  $("editToggle").addEventListener("click", function(){
    state.edit=!state.edit; this.setAttribute("aria-pressed",String(state.edit)); this.textContent = state.edit?"結束編輯":"編輯資料";
    $("doneBtn").hidden = !state.edit;
    if(state.edit) window.scrollTo({top:0});
    $("notice").style.cursor = state.edit ? "pointer" : "";
    renderBar(); render();
  });
  $("notice").addEventListener("click", function(){ if(state.edit) showNoticeEdit(); });
  $("doneBtn").addEventListener("click", function(){ $("editToggle").click(); });
  $("doneBtn").hidden = true;
  $("addBtn").addEventListener("click", function(){ showEdit(null); });

  function toggleFav(id){
    if(favs[id]) delete favs[id]; else favs[id]=1;
    store(false, FAV_KEY, JSON.stringify(Object.keys(favs)));
  }
  document.addEventListener("click", function(e){
    var t;
    if((t=e.target.closest("[data-fav]"))){ toggleFav(t.dataset.fav); if(!$("sheetBg").hidden) showDetail(t.dataset.fav); render(); return; }
    if((t=e.target.closest("[data-edit]"))){ showEdit(t.dataset.edit); return; }
    if((t=e.target.closest("[data-open]"))){ showDetail(t.dataset.open); return; }
    if(e.target.closest("[data-close]") || e.target===$("sheetBg")){ closeSheet(); }
  });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape" && !$("sheetBg").hidden) closeSheet(); });

  renderMeta(); renderFloorSel(); renderBar(); render();

  if("serviceWorker" in navigator && location.protocol === "https:"){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }

  // In the published artifact, shops.json holds the latest saved data; use it when it's newer.
  if(location.protocol.indexOf("http")===0){
    fetch("shops.json",{cache:"no-store"}).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
      if(!d || !d.meta || !d.shops || dirty) return;
      if(!localMode || d.meta.updatedAt >= DATA.meta.updatedAt){
        if(localMode && d.meta.updatedAt >= DATA.meta.updatedAt){ storeDel(LOCAL_KEY); localMode=false; }
        DATA = d; renderMeta(); renderFloorSel(); renderBar(); render();
      }
    }).catch(function(){});
  }
})();
</script>

</body>
</html>
