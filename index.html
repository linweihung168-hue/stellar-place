<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nekobasu</title>
<meta name="description" content="Nekobasu 旅行小幫手：行程倒數、購物清單、行李清單、匯率，與札幌站四商場店鋪指南">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nekobasu">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: station-signage list. Sticky header (mall tabs, search, filters), floor-grouped rows, elevator-plate badges per mall/area. */
:root{
  --bg:#eef2f8; --surface:#ffffff; --ink:#14213a; --muted:#5a6882; --line:#d8e0ec;
  --accent:#2f6fd6; --accent-ink:#ffffff; --accent-soft:#e3ecfb;
  --stellar-c:#1d3f86; --stellar-e:#0e7c7f; --apia-w:#6b3fa0; --apia-c:#9a5b00; --tokyu:#b3261e; --daimaru:#2e6b34;
  --star:#d79a00; --warn-bg:#fff4dc; --warn-ink:#7a5200; --danger:#c0362c; --wing-ink:#ffffff; --ok:#2e7d4f; --nav-h:58px;
  --f-display:"Barlow Condensed","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-ja:"Zen Kaku Gothic New","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","Zen Kaku Gothic New",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1322; --surface:#141e33; --ink:#e5ecf8; --muted:#94a3bd; --line:#253350;
  --accent:#6da5ff; --accent-ink:#0c1322; --accent-soft:#1b2a48;
  --stellar-c:#8eaeff; --stellar-e:#45c4c6; --apia-w:#c4a2f0; --apia-c:#f0b85a; --tokyu:#ff8a80; --daimaru:#8fd394;
  --star:#f2b928; --warn-bg:#3a2e12; --warn-ink:#f3d58f; --danger:#ff7b70; --wing-ink:#0c1322; --ok:#5fcf8f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1322; --surface:#141e33; --ink:#e5ecf8; --muted:#94a3bd; --line:#253350;
  --accent:#6da5ff; --accent-ink:#0c1322; --accent-soft:#1b2a48;
  --stellar-c:#8eaeff; --stellar-e:#45c4c6; --apia-w:#c4a2f0; --apia-c:#f0b85a; --tokyu:#ff8a80; --daimaru:#8fd394;
  --star:#f2b928; --warn-bg:#3a2e12; --warn-ink:#f3d58f; --danger:#ff7b70; --wing-ink:#0c1322; --ok:#5fcf8f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:8px}
.brand .mark{width:28px;height:28px;flex:none}
.brand h1{margin:0;min-width:0;font-family:var(--f-ja);font-weight:700;font-size:19px;line-height:1.2}
.brand h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:11.5px;color:var(--muted);margin-top:3px}
.brand .sp{flex:1}
.pill-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.pill-btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.malls{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.malls::-webkit-scrollbar{display:none}
.malls button{flex:none;border:0;background:none;padding:6px 10px 8px;font-size:14px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.malls button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.search{position:relative}
.search input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:var(--r);padding:11px 40px;font-size:16px}
.search input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:18px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip .n{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-size:13px;font-weight:500;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:13px}
.filters .fav-toggle{margin-left:auto}

.notice{display:flex;gap:8px;align-items:flex-start;background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r);padding:10px 12px;font-size:13px;margin-top:14px}
.deal{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.deal summary{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;list-style:none}
.deal summary::-webkit-details-marker{display:none}
.deal summary::after{content:"";margin-left:auto;flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px)}
.deal[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
.deal-ic{flex:none;width:22px;height:22px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-ja);font-weight:700;font-size:12.5px}
.deal-t{font-weight:700;font-size:14px;flex:none}
.deal-s{font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deal-b{padding:0 12px 12px;display:grid;gap:10px;font-size:13px;line-height:1.6}
.deal-i b{display:block;font-size:13.5px}
.deal-i a{color:var(--accent);white-space:nowrap}
.deal-f{margin:0;font-size:12px;color:var(--muted)}
.meta-line{display:flex;justify-content:space-between;gap:4px 8px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin:14px 2px 4px}
.meta-line .count{font-variant-numeric:tabular-nums}

main{padding-bottom:calc(var(--nav-h) + 110px)}
.floor{margin-top:18px}
.floor-h{display:flex;align-items:baseline;gap:10px;padding:0 2px 6px;border-bottom:2px solid var(--ink)}
.floor-h .fl{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;letter-spacing:.01em}
.floor-h .hint{font-size:12.5px;color:var(--muted);min-width:0}
.floor-h .hint b{color:var(--ink);font-weight:700}
.floor-h .cnt{margin-left:auto;flex:none;font-family:var(--f-display);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.row .main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;display:flex;gap:12px;align-items:center}
.wing{flex:none;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--wing-ink)}
.wing.stellar-C{background:var(--stellar-c)} .wing.stellar-E{background:var(--stellar-e)}
.wing.apia-W{background:var(--apia-w)} .wing.apia-C{background:var(--apia-c)}
.wing.tokyu-{background:var(--tokyu);font-family:var(--f-ja);font-size:15px}
.wing.daimaru-{background:var(--daimaru);font-family:var(--f-ja);font-size:15px}
.names{min-width:0;flex:1}
.names>span{display:block}
.ja{font-family:var(--f-ja);font-weight:700;font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.alt{font-family:var(--f-ja);font-size:13px;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--muted);line-height:1.45;overflow-wrap:anywhere;margin-top:2px}
.tag{display:inline-block;font-size:11.5px;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 5px;margin-right:4px;font-weight:500}
.tag.temp{background:var(--warn-bg);color:var(--warn-ink)}
.tag.mall{background:transparent;border:1px solid var(--line);color:var(--muted)}
.star{flex:none;border:0;background:none;width:36px;height:36px;border-radius:50%;color:var(--line);font-size:20px;line-height:1}
.star[aria-pressed="true"]{color:var(--star)}
.edit-btn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13px}
.empty{padding:40px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.legend{display:grid;gap:8px;font-size:12.5px;color:var(--muted);margin-top:28px;padding:12px 2px;border-top:1px solid var(--line)}
.legend .item{display:flex;gap:8px;align-items:flex-start}
.legend .wing{width:20px;height:20px;font-size:12px;border-radius:5px;margin-top:1px}
.legend b{color:var(--ink)}
footer.foot{font-size:12.5px;color:var(--muted);padding:4px 2px 20px;display:flex;flex-direction:column;gap:4px}
footer.foot a{color:var(--accent)}
footer.foot .edit-row{margin-bottom:6px}

.bar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-block:10px;box-shadow:0 -6px 20px rgba(10,20,40,.08)}
.bar .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .msg{flex:1;min-width:160px;font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}

.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(8,14,28,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px))}
@media (min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:16px}}
.sheet h2{margin:0 0 4px;font-family:var(--f-ja);font-size:20px;line-height:1.35;text-wrap:balance}
.sheet .plate{display:flex;gap:8px;align-items:center;margin:10px 0 14px;flex-wrap:wrap}
.sheet .plate .fl{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tel{font-variant-numeric:tabular-nums;user-select:all}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.actions a.btn{text-decoration:none;color:var(--ink)}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:16px;color:var(--ink)}
.form .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.form>*,.form label{min-width:0}
.form input,.form select,.form textarea{width:100%;min-width:0;box-sizing:border-box}
.sheet{overflow-x:hidden}
.form .req::after{content:" *";color:var(--danger)}
.err{color:var(--danger);font-size:13px}
.confirm{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:10px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* ---------- bottom tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar button{flex:1;max-width:200px;height:var(--nav-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--muted)}
.tabbar svg{width:23px;height:23px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar .ico{position:relative;display:inline-flex}
.tabbar .dot{position:absolute;top:-5px;left:15px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:var(--surface);font-family:var(--f-display);font-size:12px;line-height:17px;text-align:center}
/* ---------- list views ---------- */
.vh{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.vh .wrap{display:flex;align-items:center;gap:8px;padding-block:12px}
.vh h1{margin:0;flex:1;min-width:0;font-family:var(--f-ja);font-weight:700;font-size:19px;line-height:1.2;overflow-wrap:anywhere}
.icon-btn{flex:none;width:36px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:50%;display:grid;place-items:center;padding:0;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:14px;display:grid;gap:9px}
.sum-top{display:flex;align-items:baseline;gap:8px}
.sum .big{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:.9;font-variant-numeric:tabular-nums}
.sum-l{font-weight:500}
.sum-r{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sum-money{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sum-money b{color:var(--ink);font-family:var(--f-display);font-size:16px;font-variant-numeric:tabular-nums}
.prog{display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:4px}
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .3s ease}}
.twd{margin-left:4px;font-size:.92em;color:var(--muted);white-space:nowrap}
.sum-money span em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:1px;font-variant-numeric:tabular-nums}
.ta-r{text-align:right}
.fx-line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:9px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.twd-live{font-size:12px;color:var(--muted);min-height:16px}
.chips.who{margin-top:12px}
.adder{display:flex;gap:8px;margin-top:14px}
.adder input,.adder select{min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;font-size:16px}
.adder input{flex:1}
.adder input:focus{border-color:var(--accent);outline:none}
.adder-pack{margin-top:22px;flex-wrap:wrap}
.adder-pack input{flex:1 1 100%}
.adder-pack select{flex:1}
.sugs{list-style:none;margin:6px 0 0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.sugs li+li{border-top:1px solid var(--line)}
.sugs .sug-h{padding:8px 12px;font-size:12.5px;color:var(--muted)}
.sugs button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:9px 12px;text-align:left}
.sug-act{flex:none;font-size:12.5px;color:var(--accent);font-weight:500}
.route-note{margin:14px 2px 0;font-size:12.5px;color:var(--muted)}
.fl-sm{font-family:var(--f-ja) !important;font-size:18px !important}
.ck{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:transparent}
.ck svg{width:17px;height:17px}
.ck[aria-checked="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.row.done .ja{text-decoration:line-through;color:var(--muted)}
.row.done .wing{opacity:.45}
.wing.none{background:var(--line);color:var(--muted);font-family:var(--f-body);font-size:14px}
.chev{flex:none;width:18px;height:18px;color:var(--muted);margin-left:auto}
.ja-sm{font-size:15px;font-weight:500}
.qty{font-family:var(--f-display);color:var(--muted);font-weight:600}
.done-sec{margin-top:22px}
.done-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:none;padding:12px 2px;font-weight:500;color:var(--muted)}
.done-toggle span{font-size:13px;color:var(--accent)}
.empty-card{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.empty-card b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty-ico{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 14px;border-radius:22px;background:var(--accent-soft);color:var(--accent)}
.empty-ico svg{width:38px;height:38px}
.hint-p{margin:8px 2px 0;font-size:13px;color:var(--muted)}
.trip{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;margin-top:12px}
.trip-main{flex:1;min-width:0;display:grid;gap:5px}
.link-btn{border:0;background:none;padding:0;color:var(--accent);font-size:13px;font-weight:500}
.chips-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips-wrap .chip[aria-pressed="true"]::before{content:"✓ "}
.pick{display:grid;gap:6px}
.pick-l{font-size:13px;color:var(--muted)}
.pick-cur{display:flex;align-items:center;gap:10px;min-height:36px}
.pick input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:16px;color:var(--ink)}

 --navy:#1F3A56;--orange:#E8892B;--ok:#2F9E5B;--danger:#D9534A;--fill:#E9E9EE;
 --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Zen Kaku Gothic New",system-ui,sans-serif;
 --f-ja:-apple-system,BlinkMacSystemFont,"Hiragino Sans","PingFang TC","Zen Kaku Gothic New","Noto Sans TC",sans-serif;--r:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--surface:#1C1C1E;--ink:#F2F2F7;--muted:#98989F;--line:#38383A;--accent:#6AA8E8;--accent-ink:#0b1420;--accent-soft:#1E2D3F;--fill:#2C2C2E;--ok:#4CC27A;--danger:#FF6B61;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000000;--surface:#1C1C1E;--ink:#F2F2F7;--muted:#98989F;--line:#38383A;--accent:#6AA8E8;--accent-ink:#0b1420;--accent-soft:#1E2D3F;--fill:#2C2C2E;--ok:#4CC27A;--danger:#FF6B61;color-scheme:dark}
body{font-size:16px;-webkit-font-smoothing:antialiased}
body::before{background:var(--bg)}
#view-home,#view-set{padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
/* large titles */
header.top,.vh{background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:.5px solid var(--line)}
.lt{display:flex;align-items:baseline;gap:10px;padding-top:4px}
.lt h1,.vh h1{margin:0;font-family:var(--f-body);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.15}
.vh h1 small{display:inline;margin-left:8px;font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.lt-s{font-size:14px;color:var(--muted);font-weight:500}
.search input{background:var(--fill);border:0;border-radius:11px;padding:10px 38px;font-size:17px}
.search input:focus{background:var(--fill);box-shadow:0 0 0 3px var(--accent-soft)}
.malls{border-bottom:0;gap:6px}

.malls button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip{border:0;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg{border:0;background:var(--fill);border-radius:9px;padding:2px;gap:2px}

.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.filters select,.pill-btn{border:0;background:var(--fill)}
.pill-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
/* shop floors as grouped cards */
#results .floor{margin-top:22px}
#results .floor-h{width:100%;border:0;background:none;text-align:left;padding:0 4px 8px;align-items:center;color:var(--ink)}
#results .floor-h .fl{font-family:var(--f-body);font-size:24px;font-weight:800;letter-spacing:-.01em}
.fold-c{width:18px;height:18px;flex:none;color:var(--muted);transition:transform .15s}
#results .floor.shut .fold-c{transform:rotate(-90deg)}

#results .list,#commonSec .list{background:var(--surface);border-radius:14px;overflow:hidden}

.deal,.notice,.sum,.trip,.empty-card{border:0;border-radius:14px;background:var(--surface)}
.btn{border-radius:11px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* tab bar */
.tabbar{background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:.5px solid var(--line)}

.hsec-h{display:flex;align-items:center}

.hsec-t[aria-expanded="false"] .hsec-c{transform:rotate(-90deg)}
/* grouped list */
.glist{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;overflow:hidden}

  // select + hidden "new category" input; returns a function that reads the chosen category (adding a new one to cats)
  function wireCatSelect(selId, newId, cats){
    var sel = $(selId), inp = $(newId);
    function sync(){ inp.hidden = sel.value !== "__new"; if(!inp.hidden) inp.focus(); }
    sel.addEventListener("change", sync); sync();
    return function(){
      if(sel.value !== "__new") return sel.value;

      if(cats.indexOf(n) < 0) cats.push(n);

  // manage a category array: add, rename, reorder, delete
  function catSheet(title, cats, onRename, onDelete, after){
    function body(){
      return (cats.length ? cats.map(function(c, i){
        return '<li class="grow"><input class="cat-in" data-ci="'+i+'" value="'+esc(c)+'" aria-label="分類名稱">'
          + '<button type="button" class="mv" data-cu="'+i+'" aria-label="'+esc(c)+' 往上"'+(i===0?" disabled":"")+'>↑</button>'
          + '<button type="button" class="mv" data-cd="'+i+'" aria-label="'+esc(c)+' 往下"'+(i===cats.length-1?" disabled":"")+'>↓</button>'
          + '<button type="button" class="g-x" data-cx="'+i+'" aria-label="刪除 '+esc(c)+'">×</button></li>';
      }).join("") : '<li class="grow"><span class="g-t" style="color:var(--muted)">還沒有分類</span></li>')
        + '<li class="grow"><form id="catAdd" class="g-add" autocomplete="off"><input id="catAddIn" placeholder="＋ 新增分類" aria-label="新增分類"></form></li>';

      + '<p class="sub" style="margin:6px 2px 0">點分類名稱可以直接改名。刪除分類不會刪掉物品，物品會移到「'+NOCAT+'」。</p>'
      + '<div class="actions"><button type="button" class="btn primary" id="catDone">完成</button></div>', title);
    function redraw(focusAdd){ $("catList").innerHTML = body(); wire(); after(); if(focusAdd) $("catAddIn").focus(); }
    function wire(){
      $("catAdd").addEventListener("submit", function(e){ e.preventDefault(); var v = $("catAddIn").value.trim(); if(!v || v === NOCAT) return; if(cats.indexOf(v) < 0) cats.push(v); redraw(true); });
    }
    wire();
    $("catList").addEventListener("change", function(e){
      var t = e.target.closest("[data-ci]"); if(!t) return;
      var i = +t.dataset.ci, old = cats[i], v = t.value.trim();
      if(!v || v === NOCAT || (v !== old && cats.indexOf(v) >= 0)){ t.value = old; return; }
      if(v !== old){ cats[i] = v; onRename(old, v); after(); }
    });
    $("catList").addEventListener("click", function(e){
      var b = e.target.closest("button"); if(!b) return;

      else if(b.dataset.cd){ i = +b.dataset.cd; cats.splice(i+1, 0, cats.splice(i,1)[0]); redraw(); }
      else if(b.dataset.cx){ i = +b.dataset.cx; var c = cats.splice(i,1)[0]; onDelete(c); redraw(); }
    });
    $("catDone").addEventListener("click", function(){
      var a = document.activeElement; if(a && a.blur) a.blur();
      var v = $("catAddIn") ? $("catAddIn").value.trim() : "";
      if(v && v !== NOCAT && cats.indexOf(v) < 0) cats.push(v);
      closeSheet(); after();
    });
  }

  // ===================== Packing lists =====================
  var LEGACY_ORDER = ["證件與錢","3C 電子","衣物","盥洗保養","藥品","雜物","禦寒","溫泉","小孩","工作","其他"];
  var packOpen = null, packHideDone = false, packLastCat = "";
  function findPack(id){ for(var i=0;i<PACKS.lists.length;i++) if(PACKS.lists[i].id===id) return PACKS.lists[i]; return null; }
  function packCats(l){
    if(!Array.isArray(l.cats)){
      var seen = {}; l.items.forEach(function(i){ if(i.c) seen[i.c] = 1; });
      l.cats = Object.keys(seen).sort(function(a,b){ var ia = LEGACY_ORDER.indexOf(a), ib = LEGACY_ORDER.indexOf(b); return (ia<0?99:ia) - (ib<0?99:ib); });
    }
    l.items.forEach(function(i){ if(i.c && l.cats.indexOf(i.c) < 0) l.cats.push(i.c); });
    return l.cats;
  }
  function newPack(name, withCommon){
    var l = { id: uid(), name: name, cats: [], items: [], created: Date.now() };
    if(withCommon) COMMON.forEach(function(c){
      var cat = c.c && c.c !== "其他" ? c.c : (c.c || "");
      if(cat && l.cats.indexOf(cat) < 0) l.cats.push(cat);
      l.items.push({ id: uid(), c: cat, n: c.n, q: c.q || 1, done: false });
    });
    return l;
  }
  function packProgress(l){ var d = l.items.filter(function(i){ return i.done; }).length; return { d: d, t: l.items.length, pct: l.items.length ? Math.round(d/l.items.length*100) : 0 }; }

    function done(src, blob){
      var box = $("pstBox"); if(!box) return;
      box.innerHTML = '<img src="'+src+'" alt="小樽散步地圖分享圖">';
      var file = blob ? new File([blob], "otaru-walk-map.png", { type: "image/png" }) : null;

  // ===================== Photos for shopping items (IndexedDB, this device only) =====================
  var PH_MAX = 3, phDB = null, phURL = {}, phFresh = {};
  function phOpen(){
    if(phDB) return phDB;
    phDB = new Promise(function(res, rej){
      try{
        var r = indexedDB.open("nekobasu", 1);
        r.onupgradeneeded = function(){ r.result.createObjectStore("photos"); };
        r.onsuccess = function(){ res(r.result); };
        r.onerror = function(){ rej(r.error); };
      }catch(e){ rej(e); }
    });
    phDB.catch(function(){ phDB = null; });
    return phDB;
  }
  function phTx(mode, fn){
    return phOpen().then(function(db){ return new Promise(function(res, rej){
      var tx = db.transaction("photos", mode), st = tx.objectStore("photos"), out = fn(st);
      tx.oncomplete = function(){ res(out && "result" in out ? out.result : undefined); };
      tx.onerror = function(){ rej(tx.error); }; tx.onabort = function(){ rej(tx.error); };
    }); });
  }
  function phPut(id, blob){ return phTx("readwrite", function(st){ st.put(blob, id); }); }
  function phGet(id){ return phTx("readonly", function(st){ return st.get(id); }); }
  function phDel(id){ if(phURL[id]){ URL.revokeObjectURL(phURL[id]); delete phURL[id]; } return phTx("readwrite", function(st){ st.delete(id); }); }
  function phKeys(){ return phTx("readonly", function(st){ return st.getAllKeys(); }); }
  function phSrc(id){
    if(phURL[id]) return Promise.resolve(phURL[id]);
    return phGet(id).then(function(b){ if(!b) return ""; phURL[id] = URL.createObjectURL(b); return phURL[id]; });
  }
  // shrink a picked file to a ~1280px JPEG
  function phShrink(file, max){
    return new Promise(function(res, rej){
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function(){
        var w = img.naturalWidth, h = img.naturalHeight, m = max || 1280, k = Math.min(1, m / Math.max(w, h));
        var c = document.createElement("canvas"); c.width = Math.round(w*k); c.height = Math.round(h*k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function(b){ b ? res(b) : rej(new Error("toBlob")); }, "image/jpeg", 0.82);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("decode")); };
      img.src = url;
    });
  }
  function phAllRefs(){

  // ---- photo editor inside the item sheet
  function phEditor(it, onChange){
    var cur = (it.ph || []).slice(), busy = 0;
    function draw(){
      var box = $("i_ph"); if(!box) return;
      $("i_phl").textContent = "照片（" + cur.length + " / " + PH_MAX + "）";
      box.innerHTML = cur.map(function(id, i){ return '<span class="th"><img alt="照片 '+(i+1)+'" data-phid="'+id+'"><button type="button" class="th-x" data-phx="'+i+'" aria-label="刪除照片 '+(i+1)+'">✕</button></span>'; }).join("")
        + (busy ? '<span class="th th-busy" aria-label="處理中">…</span>' : '');
      box.hidden = !cur.length && !busy;
      $("i_phbtns").hidden = cur.length + busy >= PH_MAX;
      Array.prototype.forEach.call(box.querySelectorAll("img[data-phid]"), function(im){ phSrc(im.dataset.phid).then(function(u){ if(u) im.src = u; }); });
      if(onChange && !busy) onChange(cur.slice());
    }
    function take(files){
      files = Array.prototype.slice.call(files || [], 0, PH_MAX - cur.length - busy);
      files.forEach(function(f){
        busy++; draw();
        phShrink(f).then(function(b){ var id = "ph" + uid(); phFresh[id] = 1; return phPut(id, b).then(function(){ cur.push(id); a2hsPending = true; }); })
          .catch(function(){ var e = $("i_pherr"); if(e){ e.textContent = "這張照片無法讀取，請換一張試試。"; e.hidden = false; } })
          .then(function(){ busy--; draw(); });
      });
    }
    $("i_cam").addEventListener("change", function(){ take(this.files); this.value = ""; });
    $("i_lib").addEventListener("change", function(){ take(this.files); this.value = ""; });
    $("i_ph").addEventListener("click", function(e){
      var x = e.target.closest("[data-phx]"); if(x){ var gone = cur.splice(+x.dataset.phx, 1)[0]; if((it.ph||[]).indexOf(gone) < 0) phDel(gone).catch(function(){}); draw(); return; }

    });
    draw();
    return function(){ var removed = (it.ph||[]).filter(function(p){ return cur.indexOf(p) < 0; }); it.ph = cur.slice(); if(!it.ph.length) delete it.ph; return removed; };
  }

    v.innerHTML = '<button type="button" class="pv-x" id="pvClose" aria-label="關閉">✕</button>'
      + '<div class="pv-track" id="pvTrack">'+ids.map(function(id, i){ return '<div class="pv-slide"><img alt="'+esc(name)+' 照片 '+(i+1)+'" data-phid="'+id+'"></div>'; }).join("")+'</div>'
      + (ids.length > 1 ? '<div class="pv-dots" id="pvDots">'+ids.map(function(_, i){ return '<i'+(i===start?' class="on"':'')+'></i>'; }).join("")+'</div>' : '')
      + '<div class="pv-cap"><span class="pv-n">'+esc(name)+'</span>'+(qty > 1 ? '<span class="pv-q">× '+qty+'</span>' : '')+'</div>';
    v.hidden = false; v.dataset.sheet = fromSheet ? "1" : "";
    Array.prototype.forEach.call(v.querySelectorAll("img[data-phid]"), function(im){ phSrc(im.dataset.phid).then(function(u){ if(u) im.src = u; }); });
    var tr = $("pvTrack");
    requestAnimationFrame(function(){ tr.scrollLeft = start * tr.clientWidth; });
    tr.addEventListener("scroll", function(){
      var d = $("pvDots"); if(!d) return; var i = Math.round(tr.scrollLeft / tr.clientWidth);
      Array.prototype.forEach.call(d.children, function(x, k){ x.className = k === i ? "on" : ""; });
    });
    $("pvClose").addEventListener("click", phViewerClose);
    $("pvClose").focus();
  }
  function phViewerClose(){ var v = $("phView"); v.hidden = true; v.innerHTML = ""; }
  document.addEventListener("keydown", function(e){ if(e.key === "Escape" && !$("phView").hidden){ e.stopPropagation(); phViewerClose(); } }, true);

  // ===================== Swipe actions, undo, edge-swipe back =====================
  var SW_W = 216, swOpen = null, tStart = null, swallowUntil = 0;
  function swActs(kind, id){
    return '<div class="sw-acts" aria-hidden="true">'
      + '<button type="button" class="sa-move" tabindex="-1" data-sact="move" data-skind="'+kind+'" data-sid="'+id+'">移動</button>'
      + '<button type="button" class="sa-edit" tabindex="-1" data-sact="edit" data-skind="'+kind+'" data-sid="'+id+'">編輯</button>'
      + '<button type="button" class="sa-del" tabindex="-1" data-sact="del" data-skind="'+kind+'" data-sid="'+id+'">刪除</button></div>';
  }
  function swSet(li, x, anim){ li.classList.toggle("sw-anim", !!anim); li.style.setProperty("--sx", x + "px"); }
  function swClose(){ if(swOpen){ swSet(swOpen, 0, true); swOpen = null; } }
  function swallowClick(){ swallowUntil = Date.now() + 350; }

  // back navigation history
  var NAV = [], navSkip = false;
  function navPush(){
    var top = NAV[NAV.length-1], s = { v: view, p: view === "pack" ? packOpen : null };
    if(top && top.v === s.v && top.p === s.p) return;
    NAV.push(s); if(NAV.length > 30) NAV.shift();
  }
  function canBack(){ return NAV.length > 0 || (view === "pack" && !!packOpen); }
  function goBack(){
    var s = NAV.pop();
    if(!s){ if(view === "pack" && packOpen){ packOpen = null; renderPack(); window.scrollTo({top:0}); } return; }
    if(s.v === "pack") packOpen = s.p;
    if(s.v === view){ if(view === "pack") renderPack(); window.scrollTo({top:0}); return; }
    navSkip = true; setView(s.v); navSkip = false;
  }

  document.addEventListener("touchstart", function(e){
    tStart = null;
    if(e.touches.length !== 1 || !$("sheetBg").hidden || !$("phView").hidden) return;
    var t = e.touches[0], li = e.target.closest(".swr");
    var edge = t.clientX < 24 && canBack();
    if(swOpen && li !== swOpen && !e.target.closest(".sw-acts")){ swClose(); swallowClick(); return; }
    tStart = { x: t.clientX, y: t.clientY, li: edge ? null : li, edge: edge, base: (li && li === swOpen) ? -SW_W : 0, dir: null, dx: 0, sx: 0 };
  }, { passive: true });
  document.addEventListener("touchmove", function(e){
    var s = tStart; if(!s) return;
    var t = e.touches[0], dx = t.clientX - s.x, dy = t.clientY - s.y;
    if(!s.dir){ if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return; s.dir = Math.abs(dx) > Math.abs(dy) * 1.2 ? "h" : "v"; }
    if(s.dir !== "h") return;
    if(s.edge){ e.preventDefault(); s.dx = dx; $("view-"+view).style.transform = "translateX(" + Math.max(0, dx) + "px)"; return; }
    if(!s.li) return;
    e.preventDefault();
    s.sx = Math.min(0, Math.max(-SW_W - 30, s.base + dx));
    swSet(s.li, s.sx, false);
  }, { passive: false });
  function touchEnd(){
    var s = tStart; tStart = null;
    if(!s || s.dir !== "h") return;
    swallowClick();
    if(s.edge){
      var v = $("view-"+view); v.classList.add("sw-anim");
      if(s.dx > 90){ v.style.transform = "translateX(100%)"; setTimeout(function(){ v.classList.remove("sw-anim"); v.style.transform = ""; goBack(); }, 190); }
      else { v.style.transform = ""; setTimeout(function(){ v.classList.remove("sw-anim"); }, 220); }
      return;
    }
    if(!s.li) return;
    if(s.sx < -60){ if(swOpen && swOpen !== s.li) swClose(); swSet(s.li, -SW_W, true); swOpen = s.li; }
    else { swSet(s.li, 0, true); if(swOpen === s.li) swOpen = null; }
  }
  document.addEventListener("touchend", touchEnd);
  document.addEventListener("touchcancel", touchEnd);
  document.addEventListener("click", function(e){
    if(Date.now() < swallowUntil && !e.target.closest(".sw-acts")){ e.stopPropagation(); e.preventDefault(); return; }
    if(swOpen && !e.target.closest(".sw-acts")){ swClose(); e.stopPropagation(); e.preventDefault(); }
  }, true);
  document.addEventListener("click", function(e){
    var b = e.target.closest("[data-sact]"); if(!b) return;
    var kind = b.dataset.skind, id = b.dataset.sid, a = b.dataset.sact;
    swClose();
    if(kind === "b"){ if(a === "edit") editBuy(id); else if(a === "del") delBuy(id); else moveSheet("b", id); return; }
    var l = findPack(packOpen); if(!l) return;
    if(a === "edit") editPackItem(l, id); else if(a === "del") delPack(l, id); else moveSheet("p", id);
  });

  // ---- delete with undo
  var toastT = null;
  function toast(msg, undo){
    var el = $("toast");
    el.innerHTML = '<span>'+esc(msg)+'</span>' + (undo ? '<button type="button" id="toastUndo">復原</button>' : '');
    el.hidden = false; clearTimeout(toastT);
    toastT = setTimeout(function(){ el.hidden = true; }, 5000);
    if(undo) $("toastUndo").addEventListener("click", function(){ el.hidden = true; clearTimeout(toastT); undo(); });
  }
  function delBuy(id){
    var i = -1; BUY.items.forEach(function(x, k){ if(x.id === id) i = k; }); if(i < 0) return;
    var it = BUY.items.splice(i, 1)[0], list = BUY; saveBuy(); renderBuy();
    toast("已刪除「" + it.n + "」", function(){ list.items.splice(Math.min(i, list.items.length), 0, it); if(list === BUY){ saveBuy(); renderBuy(); } });
  }
  function delPack(l, id){
    var i = -1; l.items.forEach(function(x, k){ if(x.id === id) i = k; }); if(i < 0) return;
    var it = l.items.splice(i, 1)[0]; savePacks(); renderPack();
    toast("已刪除「" + it.n + "」", function(){ l.items.splice(Math.min(i, l.items.length), 0, it); savePacks(); renderPack(); });
  }

  // ---- move to another category
  function moveSheet(kind, id){
    var it = null, cats, cur;
    if(kind === "b"){ it = findBuy(id); cats = buyCats(); }
    else { var l = findPack(packOpen); if(!l) return; l.items.forEach(function(x){ if(x.id === id) it = x; }); cats = packCats(l); }
    if(!it) return;
    cur = (kind === "b" ? it.cat : it.c) || "";
    function done(c){ if(kind === "b"){ it.cat = c; saveBuy(); renderBuy(); } else { it.c = c; savePacks(); renderPack(); } closeSheet(); }
    openSheet('<h2>移動「'+esc(it.n)+'」到</h2><ul class="glist glist-card" id="mvList">'
      + cats.concat([""]).map(function(c){ return '<li class="grow"><button type="button" class="g-btn" data-mv="'+esc(c)+'"><span class="g-t">'+esc(c || NOCAT)+'</span>'+(c === cur ? '<span class="g-chk">✓</span>' : '')+'</button></li>'; }).join("")
      + '<li class="grow"><form id="mvNew" class="g-add" autocomplete="off"><input id="mvNewIn" placeholder="＋ 新增分類並移過去" aria-label="新增分類並移過去"></form></li></ul>'
      + '<div class="actions"><button type="button" class="btn" data-close>取消</button></div>', "移動到分類");
    $("mvList").addEventListener("click", function(e){ var b = e.target.closest("[data-mv]"); if(b) done(b.dataset.mv); });
    $("mvNew").addEventListener("submit", function(e){ e.preventDefault(); var v = $("mvNewIn").value.trim(); if(!v || v === NOCAT) return; if(cats.indexOf(v) < 0) cats.push(v); done(v); });
  }

  // ---- inline "+ 新增" rows (packing sections, shopping category mode)
  function addRowHTML(kind, cat, open, label){
    if(open) return '<li class="row add-row"><form class="inline-add" data-iakind="'+kind+'" data-iacat="'+esc(cat)+'" autocomplete="off"><span class="pl" aria-hidden="true">＋</span><input id="iaIn" placeholder="'+label+'" enterkeyhint="done" aria-label="'+label+'（'+esc(cat || NOCAT)+'）"></form></li>';
    return '<li class="row add-row"><button type="button" class="add-btn" data-iaopen="'+kind+'" data-iacat="'+esc(cat)+'"><span class="pl" aria-hidden="true">＋</span>'+label+'</button></li>';
  }
  function addCatHTML(kind, open){
    if(open) return '<form class="inline-add addcat-form" data-nckind="'+kind+'" autocomplete="off"><span class="pl" aria-hidden="true">＋</span><input id="ncIn" placeholder="分類名稱" enterkeyhint="done" aria-label="新增分類名稱"></form>';
    return '<button type="button" class="addcat-btn" data-ncopen="'+kind+'">＋ 新增分類</button>';
  }
  var adding = { kind: null, cat: null }, addingCat = null;
  function rerender(kind){ if(kind === "b") renderBuy(); else renderPack(); }
  function focusInline(){
    var i = $("iaIn") || $("ncIn"); if(!i) return;
    i.focus();
    i.addEventListener("blur", function(){
      var me = i;
      setTimeout(function(){
        if(document.activeElement && (document.activeElement.id === "iaIn" || document.activeElement.id === "ncIn")) return;
        if(me.value.trim() || !document.body.contains(me)) return;
        var k = adding.kind || addingCat; adding = { kind: null, cat: null }; addingCat = null; if(k) rerender(k);
      }, 150);
    });
  }
  document.addEventListener("click", function(e){
    var b;
    if((b = e.target.closest("[data-iaopen]"))){ adding = { kind: b.dataset.iaopen, cat: b.dataset.iacat }; addingCat = null; rerender(adding.kind); return; }
    if((b = e.target.closest("[data-ncopen]"))){ addingCat = b.dataset.ncopen; adding = { kind: null, cat: null }; rerender(addingCat); }
  });
  document.addEventListener("submit", function(e){
    var f = e.target, v;
    if(f.matches(".inline-add[data-iakind]")){
      e.preventDefault(); v = $("iaIn").value.trim(); if(!v) return;
      var kind = f.dataset.iakind, cat = f.dataset.iacat;
      if(kind === "b"){ addBuy(v, "", { cat: cat }); renderBuy(); }
      else { var l = findPack(packOpen); if(!l) return; l.items.push({ id: uid(), c: cat, n: v, q: 1, done: false }); savePacks(); renderPack(); }
      return;
    }
    if(f.matches(".addcat-form")){
      e.preventDefault(); v = $("ncIn").value.trim(); var k2 = f.dataset.nckind;
      if(v && v !== NOCAT){
        var cats = k2 === "b" ? buyCats() : packCats(findPack(packOpen));
        if(cats.indexOf(v) < 0) cats.push(v);
        if(k2 === "b") saveBuy(); else savePacks();
        addingCat = null; adding = { kind: k2, cat: v };
      } else addingCat = null;
      rerender(k2);
    }
  });

  setTimeout(phCleanup, 2000);
  syncModes(); applyTrip(); renderAll(); setView(view); checkImport(); fxFetch();

  // Published copies of each mall's data file win over the embedded snapshot when newer.
  if(location.protocol.indexOf("http")===0){
    MALLS.forEach(function(m){
      fetch(m.id+".json",{cache:"no-store"}).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
        if(!d || !d.meta || !d.shops || dirty[m.id]) return;
        if(d.meta.updatedAt < DATA[m.id].meta.updatedAt) return;
        if(localMode[m.id]){ storeDel(localKey(m.id)); delete localMode[m.id]; }
        DATA[m.id] = d; renderFloorSel(); renderMeta(); renderBar(); render();
      }).catch(function(){});
    });
  }
  if(BUILD==="pwa" && "serviceWorker" in navigator && location.protocol==="https:"){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
})();
</script>
