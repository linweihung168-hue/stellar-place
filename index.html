<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>札幌站店鋪查詢</title>
<meta name="description" content="札幌站周邊 Stellar Place、APIA、東急百貨店、大丸的店鋪樓層查詢">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141e33" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="札幌站逛街">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: station-signage list. Sticky header (mall tabs, search, filters), floor-grouped rows, elevator-plate badges per mall/area. */
:root{
  --bg:#eef2f8; --surface:#ffffff; --ink:#14213a; --muted:#5a6882; --line:#d8e0ec;
  --accent:#2f6fd6; --accent-ink:#ffffff; --accent-soft:#e3ecfb;
  --stellar-c:#1d3f86; --stellar-e:#0e7c7f; --apia-w:#6b3fa0; --apia-c:#9a5b00; --tokyu:#b3261e; --daimaru:#2e6b34;
  --star:#d79a00; --warn-bg:#fff4dc; --warn-ink:#7a5200; --danger:#c0362c; --wing-ink:#ffffff; --ok:#2e7d4f; --nav-h:58px;
  --f-display:"Barlow Condensed","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-ja:"Zen Kaku Gothic New","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","Zen Kaku Gothic New",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1322; --surface:#141e33; --ink:#e5ecf8; --muted:#94a3bd; --line:#253350;
  --accent:#6da5ff; --accent-ink:#0c1322; --accent-soft:#1b2a48;
  --stellar-c:#8eaeff; --stellar-e:#45c4c6; --apia-w:#c4a2f0; --apia-c:#f0b85a; --tokyu:#ff8a80; --daimaru:#8fd394;
  --star:#f2b928; --warn-bg:#3a2e12; --warn-ink:#f3d58f; --danger:#ff7b70; --wing-ink:#0c1322; --ok:#5fcf8f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1322; --surface:#141e33; --ink:#e5ecf8; --muted:#94a3bd; --line:#253350;
  --accent:#6da5ff; --accent-ink:#0c1322; --accent-soft:#1b2a48;
  --stellar-c:#8eaeff; --stellar-e:#45c4c6; --apia-w:#c4a2f0; --apia-c:#f0b85a; --tokyu:#ff8a80; --daimaru:#8fd394;
  --star:#f2b928; --warn-bg:#3a2e12; --warn-ink:#f3d58f; --danger:#ff7b70; --wing-ink:#0c1322; --ok:#5fcf8f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:8px}
.brand .mark{width:28px;height:28px;flex:none}
.brand h1{margin:0;min-width:0;font-family:var(--f-ja);font-weight:700;font-size:19px;line-height:1.2}
.brand h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:11.5px;color:var(--muted);margin-top:3px}
.brand .sp{flex:1}
.pill-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.pill-btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.malls{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.malls::-webkit-scrollbar{display:none}
.malls button{flex:none;border:0;background:none;padding:6px 10px 8px;font-size:14px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.malls button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.search{position:relative}
.search input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:var(--r);padding:11px 40px;font-size:16px}
.search input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:18px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip .n{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-size:13px;font-weight:500;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:13px}
.filters .fav-toggle{margin-left:auto}

.notice{display:flex;gap:8px;align-items:flex-start;background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r);padding:10px 12px;font-size:13px;margin-top:14px}
.deal{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.deal summary{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;list-style:none}
.deal summary::-webkit-details-marker{display:none}
.deal summary::after{content:"";margin-left:auto;flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px)}
.deal[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
.deal-ic{flex:none;width:22px;height:22px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-ja);font-weight:700;font-size:12.5px}
.deal-t{font-weight:700;font-size:14px;flex:none}
.deal-s{font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deal-b{padding:0 12px 12px;display:grid;gap:10px;font-size:13px;line-height:1.6}
.deal-i b{display:block;font-size:13.5px}
.deal-i a{color:var(--accent);white-space:nowrap}
.deal-f{margin:0;font-size:12px;color:var(--muted)}
.meta-line{display:flex;justify-content:space-between;gap:4px 8px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin:14px 2px 4px}
.meta-line .count{font-variant-numeric:tabular-nums}

main{padding-bottom:calc(var(--nav-h) + 110px)}
.floor{margin-top:18px}
.floor-h{display:flex;align-items:baseline;gap:10px;padding:0 2px 6px;border-bottom:2px solid var(--ink)}
.floor-h .fl{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;letter-spacing:.01em}
.floor-h .hint{font-size:12.5px;color:var(--muted);min-width:0}
.floor-h .hint b{color:var(--ink);font-weight:700}
.floor-h .cnt{margin-left:auto;flex:none;font-family:var(--f-display);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.row .main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;display:flex;gap:12px;align-items:center}
.wing{flex:none;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--wing-ink)}
.wing.stellar-C{background:var(--stellar-c)} .wing.stellar-E{background:var(--stellar-e)}
.wing.apia-W{background:var(--apia-w)} .wing.apia-C{background:var(--apia-c)}
.wing.tokyu-{background:var(--tokyu);font-family:var(--f-ja);font-size:15px}
.wing.daimaru-{background:var(--daimaru);font-family:var(--f-ja);font-size:15px}
.names{min-width:0;flex:1}
.names>span{display:block}
.ja{font-family:var(--f-ja);font-weight:700;font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.alt{font-family:var(--f-ja);font-size:13px;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--muted);line-height:1.45;overflow-wrap:anywhere;margin-top:2px}
.tag{display:inline-block;font-size:11.5px;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 5px;margin-right:4px;font-weight:500}
.tag.temp{background:var(--warn-bg);color:var(--warn-ink)}
.tag.mall{background:transparent;border:1px solid var(--line);color:var(--muted)}
.star{flex:none;border:0;background:none;width:36px;height:36px;border-radius:50%;color:var(--line);font-size:20px;line-height:1}
.star[aria-pressed="true"]{color:var(--star)}
.edit-btn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13px}
.empty{padding:40px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.legend{display:grid;gap:8px;font-size:12.5px;color:var(--muted);margin-top:28px;padding:12px 2px;border-top:1px solid var(--line)}
.legend .item{display:flex;gap:8px;align-items:flex-start}
.legend .wing{width:20px;height:20px;font-size:12px;border-radius:5px;margin-top:1px}
.legend b{color:var(--ink)}
footer.foot{font-size:12.5px;color:var(--muted);padding:4px 2px 20px;display:flex;flex-direction:column;gap:4px}
footer.foot a{color:var(--accent)}
footer.foot .edit-row{margin-bottom:6px}

.bar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-block:10px;box-shadow:0 -6px 20px rgba(10,20,40,.08)}
.bar .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .msg{flex:1;min-width:160px;font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}

.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(8,14,28,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px))}
@media (min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:16px}}
.sheet h2{margin:0 0 4px;font-family:var(--f-ja);font-size:20px;line-height:1.35;text-wrap:balance}
.sheet .plate{display:flex;gap:8px;align-items:center;margin:10px 0 14px;flex-wrap:wrap}
.sheet .plate .fl{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tel{font-variant-numeric:tabular-nums;user-select:all}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.actions a.btn{text-decoration:none;color:var(--ink)}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:16px;color:var(--ink)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .req::after{content:" *";color:var(--danger)}
.err{color:var(--danger);font-size:13px}
.confirm{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:10px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* ---------- bottom tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar button{flex:1;max-width:200px;height:var(--nav-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--muted)}
.tabbar svg{width:23px;height:23px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar .ico{position:relative;display:inline-flex}
.tabbar .dot{position:absolute;top:-5px;left:15px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:var(--surface);font-family:var(--f-display);font-size:12px;line-height:17px;text-align:center}
/* ---------- list views ---------- */
.vh{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.vh .wrap{display:flex;align-items:center;gap:8px;padding-block:12px}
.vh h1{margin:0;flex:1;min-width:0;font-family:var(--f-ja);font-weight:700;font-size:19px;line-height:1.2;overflow-wrap:anywhere}
.icon-btn{flex:none;width:36px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:50%;display:grid;place-items:center;padding:0;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:14px;display:grid;gap:9px}
.sum-top{display:flex;align-items:baseline;gap:8px}
.sum .big{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:.9;font-variant-numeric:tabular-nums}
.sum-l{font-weight:500}
.sum-r{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sum-money{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sum-money b{color:var(--ink);font-family:var(--f-display);font-size:16px;font-variant-numeric:tabular-nums}
.prog{display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:4px}
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .3s ease}}
.twd{margin-left:4px;font-size:.92em;color:var(--muted);white-space:nowrap}
.sum-money span em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:1px;font-variant-numeric:tabular-nums}
.ta-r{text-align:right}
.fx-line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:9px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.twd-live{font-size:12px;color:var(--muted);min-height:16px}
.chips.who{margin-top:12px}
.adder{display:flex;gap:8px;margin-top:14px}
.adder input,.adder select{min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;font-size:16px}
.adder input{flex:1}
.adder input:focus{border-color:var(--accent);outline:none}
.adder-pack{margin-top:22px;flex-wrap:wrap}
.adder-pack input{flex:1 1 100%}
.adder-pack select{flex:1}
.sugs{list-style:none;margin:6px 0 0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.sugs li+li{border-top:1px solid var(--line)}
.sugs .sug-h{padding:8px 12px;font-size:12.5px;color:var(--muted)}
.sugs button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:9px 12px;text-align:left}
.sug-act{flex:none;font-size:12.5px;color:var(--accent);font-weight:500}
.route-note{margin:14px 2px 0;font-size:12.5px;color:var(--muted)}
.fl-sm{font-family:var(--f-ja) !important;font-size:18px !important}
.ck{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:transparent}
.ck svg{width:17px;height:17px}
.ck[aria-checked="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.row.done .ja{text-decoration:line-through;color:var(--muted)}
.row.done .wing{opacity:.45}
.wing.none{background:var(--line);color:var(--muted);font-family:var(--f-body);font-size:14px}
.chev{flex:none;width:18px;height:18px;color:var(--muted);margin-left:auto}
.ja-sm{font-size:15px;font-weight:500}
.qty{font-family:var(--f-display);color:var(--muted);font-weight:600}
.done-sec{margin-top:22px}
.done-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:none;padding:12px 2px;font-weight:500;color:var(--muted)}
.done-toggle span{font-size:13px;color:var(--accent)}
.empty-card{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.empty-card b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty-ico{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 14px;border-radius:22px;background:var(--accent-soft);color:var(--accent)}
.empty-ico svg{width:38px;height:38px}
.hint-p{margin:8px 2px 0;font-size:13px;color:var(--muted)}
.trip{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;margin-top:12px}
.trip-main{flex:1;min-width:0;display:grid;gap:5px}
.link-btn{border:0;background:none;padding:0;color:var(--accent);font-size:13px;font-weight:500}
.chips-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips-wrap .chip[aria-pressed="true"]::before{content:"✓ "}
.pick{display:grid;gap:6px}
.pick-l{font-size:13px;color:var(--muted)}
.pick-cur{display:flex;align-items:center;gap:10px;min-height:36px}
.pick input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:16px;color:var(--ink)}
.check-l{display:flex !important;grid-template-columns:none;align-items:center;gap:8px;color:var(--ink) !important;font-size:14px !important}
.check-l input{width:20px;height:20px}
.menu{display:grid;gap:8px}
.share-text{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font-size:13px;color:var(--ink);resize:none;overflow-wrap:anywhere}

    { id:"daimaru", name:"大丸", ja:"大丸札幌店", areas:null,

  ];
  var MALL = {}; MALLS.forEach(function(m){ MALL[m.id] = m; });
  var ALL_FLOORS = ["B1F","1F","2F","3F","4F","5F","6F","7F","8F","9F","10F"];
  var CATS = [["all","全部"],["fashion","服飾"],["beauty","美妝"],["living","生活雜貨"],["dining","餐廳咖啡"],["souvenir","伴手禮・食品"],["other","其他"]];
  var CAT_NAME = {}; CATS.forEach(function(c){ CAT_NAME[c[0]] = c[1]; });
  var dealOpen = false;
  var FAV_KEY = "sp-favs-v2", MODE_KEY = "sp-mode-v1", MALL_KEY = "sp-mall-v1";
  function localKey(m){ return "sp-local-"+m+"-v1"; }

  function store(get, key, val){ try{ if(get) return localStorage.getItem(key); localStorage.setItem(key,val); }catch(e){ return null; } }
  function storeDel(key){ try{ localStorage.removeItem(key); }catch(e){} }
  var $ = function(id){ return document.getElementById(id); };

  var DATA = JSON.parse($("mall-data").textContent);
  var localMode = {}, dirty = {};
  MALLS.forEach(function(m){
    var raw = store(true, localKey(m.id)); if(!raw) return;
    try{
      var loc = JSON.parse(raw);
      if(loc && loc.meta && loc.shops && loc.meta.updatedAt > DATA[m.id].meta.updatedAt){ DATA[m.id] = loc; localMode[m.id] = true; }
      else storeDel(localKey(m.id));
    }catch(e){ storeDel(localKey(m.id)); }
  });

  var favs = {};
  try{ (JSON.parse(store(true,FAV_KEY)||"[]")||[]).forEach(function(k){ favs[k]=1; }); }catch(e){}
  try{ (JSON.parse(store(true,"sp-favs-v1")||"[]")||[]).forEach(function(id){ favs["stellar:"+id]=1; }); storeDel("sp-favs-v1"); store(false,FAV_KEY,JSON.stringify(Object.keys(favs))); }catch(e){}
  function favKey(s){ return s._m+":"+s.id; }

  var state = { q:"", cat:"all", area:"all", floor:"all", fav:false, edit:false,
                mode: store(true,MODE_KEY)||"zh", mall: store(true,MALL_KEY)||"all" };
  if(["zh","ja","both"].indexOf(state.mode)<0) state.mode="zh";
  if(state.mall!=="all" && !MALL[state.mall]) state.mall="all";

  function allShops(){
    var out = [];
    MALLS.forEach(function(m){
      if(state.mall!=="all" && state.mall!==m.id) return;
      (DATA[m.id].shops||[]).forEach(function(s){ s._m = m.id; out.push(s); });
    });
    return out;
  }

  // ---------- search normalisation: full/half width, case, katakana→hiragana, punctuation ----------
  function norm(s){
    s = (s||"").normalize("NFKC").toLowerCase();
    s = s.replace(/[ァ-ヶ]/g, function(ch){ return String.fromCharCode(ch.charCodeAt(0)-0x60); });
    return s.replace(/[\s・･\-‐－ー—_.,'’&＆\/／()（）「」【】!！?？:：。、〈〉]+/g,"");
  }
  function haystack(s){
    var m = MALL[s._m];
    if(!s._h) s._h = norm([s.ja,s.en,s.zh,s.d,CAT_NAME[s.c],s.note,s.f,m.name,m.ja,m.areas&&m.areas[s.b]].join(" "));
    return s._h;
  }
  function esc(t){ return String(t==null?"":t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function floorRank(f){ var i = ALL_FLOORS.indexOf(f); return i<0?99:i; }
  function mallRank(id){ return MALLS.indexOf(MALL[id]); }
  function badge(s, extra){
    var m = MALL[s._m], noArea = !m.areas;
    return '<span class="wing '+s._m+'-'+(noArea?"":s.b)+(extra||"")+'" title="'+esc(areaName(s))+'">'+esc(noArea ? m.badge : s.b)+'</span>';
  }
  function areaName(s){ var m = MALL[s._m]; return m.areas ? (m.areas[s.b]||s.b) : m.name; }

  function filtered(ignoreCat){
    var q = norm(state.q);
    return allShops().filter(function(s){
      if(!ignoreCat && state.cat!=="all" && s.c!==state.cat) return false;
      if(state.area!=="all" && s.b!==state.area) return false;
      if(state.floor!=="all" && s.f!==state.floor) return false;
      if(state.fav && !favs[favKey(s)]) return false;
      if(q && haystack(s).indexOf(q)<0) return false;
      return true;
    });
  }

  function names(s){
    var main, alt;
    if(state.mode==="ja"){ main = s.ja; alt = s.en; }
    else if(state.mode==="both"){ main = s.en || s.ja; alt = [s.en ? s.ja : "", s.zh].filter(Boolean).join("・"); }
    else { main = s.en || s.zh || s.ja; alt = (s.zh && s.zh!==main) ? s.zh : ""; }
    return { main: main, alt: alt };
  }

  // ---------- render ----------
  function renderMalls(){
    var tabs = [["all","全部商場"]].concat(MALLS.map(function(m){ return [m.id, m.name]; }));
    $("malls").innerHTML = tabs.map(function(t){
      return '<button data-mall="'+t[0]+'" aria-pressed="'+(state.mall===t[0])+'">'+esc(t[1])+'</button>';
    }).join("");
  }
  function renderAreas(){
    var m = MALL[state.mall], el = $("areas");
    if(!m || !m.areas){ el.hidden = true; state.area = "all"; return; }
    el.hidden = false;
    var opts = [["all","全區"]].concat(Object.keys(m.areas).map(function(k){ return [k, m.areas[k]]; }));
    el.innerHTML = opts.map(function(o){ return '<button data-a="'+o[0]+'" aria-pressed="'+(state.area===o[0])+'">'+esc(o[1])+'</button>'; }).join("");
  }
  function renderFloorSel(){
    var used = {}; allShops().forEach(function(s){ used[s.f]=1; });
    var fl = Object.keys(used).sort(function(a,b){ return floorRank(a)-floorRank(b) || (a<b?-1:1); });
    if(state.floor!=="all" && !used[state.floor]) state.floor = "all";
    $("floorSel").innerHTML = '<option value="all">全部樓層</option>' + fl.map(function(f){ return '<option value="'+esc(f)+'"'+(state.floor===f?" selected":"")+'>'+esc(f)+'</option>'; }).join("");
    $("floorSel").hidden = fl.length < 2;
  }
  function renderChips(){
    var base = filtered(true), n = {all:base.length};
    base.forEach(function(s){ n[s.c]=(n[s.c]||0)+1; });
    $("cats").innerHTML = CATS.map(function(c){
      return '<button class="chip" data-c="'+c[0]+'" aria-pressed="'+(state.cat===c[0])+'">'+c[1]+'<span class="n">'+(n[c[0]]||0)+'</span></button>';
    }).join("");
  }
  function rowHTML(s){
    var n = names(s);
    var intro = (s.note ? '<span class="tag temp">'+esc(s.note)+'</span>' : '')
      + (state.cat==="all" ? '<span class="tag">'+esc(CAT_NAME[s.c]||"")+'</span>' : '') + esc(s.d||"");
    return '<li class="row">'
      + '<button class="main" data-open="'+esc(favKey(s))+'">'+badge(s)
      + '<span class="names"><span class="ja">'+esc(n.main)+'</span>'
      + (n.alt ? '<span class="alt">'+esc(n.alt)+'</span>' : '')

  function searchShops(q, limit){
    var nq = norm(q); if(!nq) return [];
    var out = [];
    MALLS.forEach(function(m){ (DATA[m.id].shops||[]).forEach(function(s){ s._m = m.id; if(haystack(s).indexOf(nq) >= 0) out.push(s); }); });
    function byName(s){ return norm([s.ja,s.en,s.zh].join(" ")).indexOf(nq) >= 0 ? 0 : 1; }
    out.sort(function(a,b){ return byName(a)-byName(b) || mallRank(a._m)-mallRank(b._m) || floorRank(a.f)-floorRank(b.f); });
    return out.slice(0, limit || 5);
  }

  var ADDON = {}; ADDONS.forEach(function(a){ ADDON[a.id] = a; });
  var packOpen = null, packHideDone = false;
  function findPack(id){ for(var i=0;i<PACKS.lists.length;i++) if(PACKS.lists[i].id===id) return PACKS.lists[i]; return null; }
  function qtyFor(rule, days){
    if(rule === "day") return Math.min(Math.max(days,1), 7);
    if(rule === "half") return Math.max(1, Math.ceil(Math.min(days,7)/2));
    return typeof rule === "number" ? rule : 1;
  }
  function pushItems(list, groups, days){
    var have = {}; list.items.forEach(function(i){ have[i.n] = 1; });
    var added = 0;
    groups.forEach(function(g){ g[1].forEach(function(x){
      var n = Array.isArray(x) ? x[0] : x, q = Array.isArray(x) ? qtyFor(x[1], days) : 1;
      if(have[n]) return; have[n] = 1; added++;
      list.items.push({ id: uid(), c: g[0], n: n, q: q, done: false });
    }); });
    return added;
  }
  function buildPack(name, type, days, addons){
    var list = { id: uid(), name: name, type: type, days: days, addons: addons.slice(), items: [], created: Date.now() };
    pushItems(list, BASE[type], days);
    addons.forEach(function(a){ var A = ADDON[a]; if(!A) return;
      if(A.drop) list.items = list.items.filter(function(i){ return A.drop.indexOf(i.n) < 0; });
      pushItems(list, A.add, days); });
    var have = {}; list.items.forEach(function(i){ have[i.n] = 1; });
    COMMON.forEach(function(c){ if(!have[c.n]){ list.items.push({ id: uid(), c: c.c || "其他", n: c.n, q: c.q || 1, done: false, mine: true }); have[c.n] = 1; } });
    return list;
  }
  function packProgress(l){ var d = l.items.filter(function(i){ return i.done; }).length; return { d: d, t: l.items.length, pct: l.items.length ? Math.round(d/l.items.length*100) : 0 }; }
  function isCommon(n){ return COMMON.some(function(c){ return c.n === n; }); }

  function renderPack(){
    var l = packOpen ? findPack(packOpen) : null;
    if(packOpen && !l) packOpen = null;
    $("packTitle").textContent = l ? l.name : "行李清單";
    $("packBack").hidden = !l; $("packShare").hidden = !l; $("packMore").hidden = !l; $("packNew").hidden = !!l;
    $("packMain").innerHTML = l ? packDetailHTML(l) : packIndexHTML();
    if(l) wirePackAdd(l);
  }
  function packIndexHTML(){
    var h = "";
    if(!PACKS.lists.length){
      h += '<div class="empty-card"><span class="empty-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="7" width="14" height="12.5" rx="2.6"/><path d="M9.5 7V4.8a.8.8 0 0 1 .8-.8h3.4a.8.8 0 0 1 .8.8V7"/><path d="M9 11v5M15 11v5"/><path d="M8.5 19.5v1M15.5 19.5v1"/></svg></span><b>還沒有行李清單</b>選國外或國內、天數和加購包，自動列出要帶的東西。<div class="actions" style="justify-content:center"><button class="btn primary" data-pnew>＋ 建立第一份清單</button></div></div>';
    } else {
      h += PACKS.lists.slice().sort(function(a,b){ return b.created - a.created; }).map(function(l){
        var p = packProgress(l);
        var tags = [l.type==="abroad"?"國外":"國內", l.days+" 天"].concat((l.addons||[]).map(function(a){ return ADDON[a] ? ADDON[a].name : ""; }).filter(Boolean));
        return '<button class="trip" data-popen="'+l.id+'"><span class="trip-main"><span class="ja">'+esc(l.name)+'</span><span class="sub">'+esc(tags.join("・"))+'</span>'
          + '<span class="prog"><i style="width:'+p.pct+'%"></i></span><span class="sub">'+(p.d===p.t?"全部打包好了":"已打包 "+p.d+" / "+p.t)+'</span></span>'+ICON_NEXT+'</button>';
      }).join("");
    }
    h += '<section class="floor"><div class="floor-h"><span class="fl fl-sm">我的常用物品</span><span class="cnt">'+COMMON.length+' 樣</span></div>'
      + '<p class="hint-p">在清單裡編輯物品時勾選「記住」，之後建立新清單會自動帶入。</p>';
    if(COMMON.length){
      h += '<ul class="list">' + COMMON.map(function(c, i){
        return '<li class="row"><span class="names"><span class="ja">'+esc(c.n)+'</span><span class="sub">'+esc(c.c||"其他")+(c.q>1?"・×"+c.q:"")+'</span></span><button class="edit-btn" data-cdel="'+i+'" aria-label="不再記住 '+esc(c.n)+'">移除</button></li>';
      }).join("") + '</ul>';
    }
    return h + '</section>';
  }
  function packRow(it){
    return '<li class="row'+(it.done?" done":"")+'">'
      + '<button class="ck" role="checkbox" aria-checked="'+(!!it.done)+'" data-pck="'+it.id+'" aria-label="'+(it.done?"取消已打包":"標記已打包")+'：'+esc(it.n)+'">'+ICON_CHECK+'</button>'
      + '<button class="main" data-pedit="'+it.id+'"><span class="names"><span class="ja ja-sm">'+esc(it.n)+(it.q>1?' <span class="qty">×'+it.q+'</span>':'')+'</span>'
      + (isCommon(it.n) ? '<span class="sub">★ 常用物品</span>' : '')+'</span></button></li>';
  }
  function packDetailHTML(l){
    var p = packProgress(l), left = p.t - p.d;
    var tags = [l.type==="abroad"?"國外":"國內", l.days+" 天"].concat((l.addons||[]).map(function(a){ return ADDON[a] ? ADDON[a].name : ""; }).filter(Boolean));
    var tips = (l.addons||[]).map(function(a){ return ADDON[a] && ADDON[a].tip; }).filter(Boolean);
    var h = '<section class="sum" aria-label="進度"><div class="sum-top"><span class="big">'+left+'</span><span class="sum-l">'+(left?"樣還沒打包":"全部打包好了")+'</span><span class="sum-r">'+p.d+' / '+p.t+'</span></div>'
      + '<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+p.pct+'"><i style="width:'+p.pct+'%"></i></div>'
      + '<div class="sum-money"><span>'+esc(tags.join("・"))+'</span><button class="link-btn" id="packHide" aria-pressed="'+packHideDone+'">'+(packHideDone?"顯示已打包":"隱藏已打包")+'</button></div></section>';
    if(tips.length) h += '<p class="route-note">💡 '+tips.map(esc).join("；")+'</p>';
    var cats = {};
    l.items.forEach(function(i){ (cats[i.c] = cats[i.c] || []).push(i); });
    var order = Object.keys(cats).sort(function(a,b){ var ia = CAT_ORDER.indexOf(a), ib = CAT_ORDER.indexOf(b); return (ia<0?99:ia) - (ib<0?99:ib); });
    order.forEach(function(c){
      var arr = cats[c], d = arr.filter(function(i){ return i.done; }).length;
      var shown = packHideDone ? arr.filter(function(i){ return !i.done; }) : arr.filter(function(i){ return !i.done; }).concat(arr.filter(function(i){ return i.done; }));
      if(!shown.length && packHideDone) return;
      h += '<section class="floor"><div class="floor-h"><span class="fl fl-sm">'+esc(c)+'</span><span class="cnt">'+d+' / '+arr.length+'</span></div><ul class="list">'+shown.map(packRow).join("")+'</ul></section>';
    });
    h += '<form class="adder adder-pack" id="packAdd" autocomplete="off"><input id="packInput" placeholder="新增物品" aria-label="新增物品">'
      + '<select id="packCat" aria-label="分類">'+CAT_ORDER.map(function(c){ return '<option'+(c==="其他"?" selected":"")+'>'+c+'</option>'; }).join("")+'</select>'
      + '<button class="btn primary" type="submit">新增</button></form>';
    return h;
  }
  function wirePackAdd(l){
    $("packAdd").addEventListener("submit", function(e){
      e.preventDefault(); var n = $("packInput").value.trim(); if(!n) return;
      var c = $("packCat").value;
      l.items.push({ id: uid(), c: c, n: n, q: 1, done: false }); savePacks(); renderPack();
      $("packCat").value = c; $("packInput").focus();
    });
  }
  $("packMain").addEventListener("click", function(e){
    var t, l = packOpen ? findPack(packOpen) : null;
    if((t = e.target.closest("[data-popen]"))){ packOpen = t.dataset.popen; renderPack(); window.scrollTo({top:0}); return; }
    if(e.target.closest("[data-pnew]")){ newPackSheet(); return; }
    if((t = e.target.closest("[data-cdel]"))){ COMMON.splice(+t.dataset.cdel, 1); saveCommon(); renderPack(); return; }
    if(!l) return;
    if((t = e.target.closest("[data-pck]"))){ l.items.forEach(function(i){ if(i.id===t.dataset.pck) i.done = !i.done; }); savePacks(); renderPack(); return; }
    if((t = e.target.closest("[data-pedit]"))){ editPackItem(l, t.dataset.pedit); return; }
    if(e.target.closest("#packHide")){ packHideDone = !packHideDone; renderPack(); }
  });
  $("packBack").addEventListener("click", function(){ packOpen = null; renderPack(); window.scrollTo({top:0}); });
  $("packNew").addEventListener("click", newPackSheet);

  function addonChips(sel){
    return ADDONS.map(function(a){ return '<button type="button" class="chip" data-ao="'+a.id+'" aria-pressed="'+(sel.indexOf(a.id)>=0)+'">'+esc(a.name)+'</button>'; }).join("");
  }
  function newPackSheet(){
    var type = "abroad", sel = ["japan"];
    openSheet('<h2>建立行李清單</h2><form class="form" id="packForm" novalidate>'
      + '<label><span class="req">清單名稱</span><input id="p_name" placeholder="例：札幌 11 月" required></label>'
      + '<div class="two"><label>旅遊類型<span class="seg" id="p_type" role="group"><button type="button" data-ty="abroad" aria-pressed="true">國外</button><button type="button" data-ty="domestic" aria-pressed="false">國內</button></span></label>'
      + '<label>天數<input id="p_days" type="number" min="1" max="60" inputmode="numeric" value="5"></label></div>'
      + '<div><span class="pick-l">加購包（可複選）</span><div class="chips-wrap" id="p_ao">'+addonChips(sel)+'</div></div>'
      + (COMMON.length ? '<p class="sub">會自動加入 '+COMMON.length+' 樣「我的常用物品」。</p>' : '')
      + '<div class="err" id="p_err" hidden></div>'
      + '<div class="actions"><button type="submit" class="btn primary">建立</button><button type="button" class="btn" data-close>取消</button></div></form>', "建立行李清單");
    $("p_type").addEventListener("click", function(e){ var b = e.target.closest("[data-ty]"); if(!b) return; type = b.dataset.ty;
      Array.prototype.forEach.call(this.children, function(x){ x.setAttribute("aria-pressed", String(x===b)); }); });
    $("p_ao").addEventListener("click", function(e){ var b = e.target.closest("[data-ao]"); if(!b) return;
      var i = sel.indexOf(b.dataset.ao); if(i<0) sel.push(b.dataset.ao); else sel.splice(i,1); b.setAttribute("aria-pressed", String(i<0)); });
    $("packForm").addEventListener("submit", function(e){
      e.preventDefault();
      var name = $("p_name").value.trim(), days = toInt($("p_days").value);
      if(!name){ var er = $("p_err"); er.textContent = "請幫清單取個名字，例如「札幌 11 月」。"; er.hidden = false; return; }
      if(!days) days = 1;
      var l = buildPack(name, type, Math.min(days,60), sel);
      PACKS.lists.push(l); savePacks(); packOpen = l.id; closeSheet(); renderPack(); window.scrollTo({top:0});
    });
  }
  function editPackItem(l, id){
    var it = null; l.items.forEach(function(i){ if(i.id===id) it = i; }); if(!it) return;
    var remembered = isCommon(it.n);
    openSheet('<h2>編輯物品</h2><form class="form" id="piForm" novalidate>'
      + '<label>名稱<input id="pi_n" value="'+esc(it.n)+'"></label>'
      + '<div class="two"><label>數量<input id="pi_q" type="number" min="1" inputmode="numeric" value="'+(it.q||1)+'"></label>'
      + '<label>分類<select id="pi_c">'+CAT_ORDER.map(function(c){ return '<option'+(c===it.c?" selected":"")+'>'+c+'</option>'; }).join("")+'</select></label></div>'
      + '<label class="check-l"><input type="checkbox" id="pi_mem"'+(remembered?" checked":"")+'> 記住，之後建立新清單自動帶入</label>'
      + '<div class="actions"><button type="submit" class="btn primary">儲存</button><button type="button" class="btn" data-close>取消</button><button type="button" class="btn danger" id="pi_del">從清單移除</button></div></form>', "編輯物品");
    $("piForm").addEventListener("submit", function(e){
      e.preventDefault();
      var old = it.n;
      it.n = $("pi_n").value.trim() || it.n; it.q = Math.max(1, toInt($("pi_q").value) || 1); it.c = $("pi_c").value;
      COMMON = COMMON.filter(function(c){ return c.n !== old && c.n !== it.n; });
      if($("pi_mem").checked) COMMON.push({ n: it.n, c: it.c, q: it.q });
      saveCommon(); savePacks(); closeSheet(); renderPack();
    });
    $("pi_del").addEventListener("click", function(){ l.items = l.items.filter(function(i){ return i.id !== it.id; }); savePacks(); closeSheet(); renderPack(); });
  }
  $("packMore").addEventListener("click", function(){
    var l = findPack(packOpen); if(!l) return;
    var sel = [];
    openSheet('<h2>'+esc(l.name)+'</h2><form class="form" id="pmForm" novalidate>'
      + '<div class="two"><label>名稱<input id="pm_name" value="'+esc(l.name)+'"></label><label>天數<input id="pm_days" type="number" min="1" inputmode="numeric" value="'+l.days+'"></label></div>'
      + '<div><span class="pick-l">再加入加購包</span><div class="chips-wrap" id="pm_ao">'+addonChips(sel)+'</div><p class="sub">只會補上清單裡還沒有的物品。</p></div>'
      + '<div class="actions"><button type="submit" class="btn primary">套用</button><button type="button" class="btn" data-close>取消</button></div></form>'
      + '<div class="menu" style="margin-top:14px"><button type="button" class="btn" id="pm_uncheck">全部改回未打包</button><button type="button" class="btn danger" id="pm_del">刪除這份清單</button><div id="pm_zone"></div></div>', "清單設定");
    $("pm_ao").addEventListener("click", function(e){ var b = e.target.closest("[data-ao]"); if(!b) return;
      var i = sel.indexOf(b.dataset.ao); if(i<0) sel.push(b.dataset.ao); else sel.splice(i,1); b.setAttribute("aria-pressed", String(i<0)); });
    $("pmForm").addEventListener("submit", function(e){
      e.preventDefault();
      l.name = $("pm_name").value.trim() || l.name; l.days = Math.min(60, toInt($("pm_days").value) || l.days);
      sel.forEach(function(a){ var A = ADDON[a]; if(!A) return; pushItems(l, A.add, l.days); if((l.addons||[]).indexOf(a)<0) (l.addons = l.addons||[]).push(a); });
      savePacks(); closeSheet(); renderPack();
    });
    $("pm_uncheck").addEventListener("click", function(){ l.items.forEach(function(i){ i.done = false; }); savePacks(); closeSheet(); renderPack(); });
    $("pm_del").addEventListener("click", function(){
      $("pm_zone").innerHTML = '<div class="confirm">確定刪除「'+esc(l.name)+'」？<button type="button" class="btn danger" id="pm_yes">刪除</button></div>';
      $("pm_yes").addEventListener("click", function(){ PACKS.lists = PACKS.lists.filter(function(x){ return x.id !== l.id; }); packOpen = null; savePacks(); closeSheet(); renderPack(); });
    });
  });
  $("packShare").addEventListener("click", function(){
    var l = findPack(packOpen); if(!l) return;
    var payload = { t:"p", n: l.name, ty: l.type, d: l.days, a: l.addons||[], i: l.items.map(function(i){ return [i.c, i.n, i.q||1]; }) };
    shareSheet("行李清單", "行李清單「"+l.name+"」（"+l.items.length+" 樣）", payload);
  });

  // ===================== Sharing via link =====================
  function b64e(str){ var bytes = new TextEncoder().encode(str), bin = ""; for(var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]); return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
  function b64d(s){ s = s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length % 4) s += "="; var bin = atob(s), bytes = new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
  function shareSheet(kind, title, payload){
    var link = SHARE_BASE + "#s" + b64e(JSON.stringify(payload));
    var text = title + "\n點開連結就能匯入：\n" + link;
    var canShare = BUILD === "pwa" && navigator.share;
    openSheet('<h2>分享'+esc(kind)+'</h2><p class="sub" style="margin:0 0 10px">把連結傳給旅伴（例如貼到 LINE），對方點開就能匯入到自己的手機。之後各自修改不會互相影響。</p>'
      + '<textarea id="sh_text" class="share-text" rows="4" readonly>'+esc(text)+'</textarea>'
      + '<div class="actions">'+(canShare?'<button type="button" class="btn primary" id="sh_send">傳送…</button>':'')
      + '<button type="button" class="btn'+(canShare?'':' primary')+'" id="sh_copy">複製</button><button type="button" class="btn" data-close>關閉</button></div><p class="sub" id="sh_msg" role="status"></p>', "分享");
    $("sh_copy").addEventListener("click", function(){
      var ta = $("sh_text");
      function fallback(){ ta.focus(); ta.select(); $("sh_msg").textContent = "已選取文字，請長按或按 Ctrl+C 複製。"; }
      try{ navigator.clipboard.writeText(text).then(function(){ $("sh_msg").textContent = "已複製，可以貼到 LINE 了。"; }, fallback); }catch(e){ fallback(); }
    });
    if(canShare) $("sh_send").addEventListener("click", function(){ navigator.share({ title: title, text: title + "\n點開連結就能匯入：", url: link }).catch(function(){}); });
  }
  function checkImport(){
    var h = location.hash || "";
    if(h.indexOf("#s") !== 0 || h.length < 4) return;
    var data = null;
    try{ data = JSON.parse(b64d(h.slice(2))); }catch(e){ data = null; }
    try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
    if(!data || !Array.isArray(data.i)){
      openSheet('<h2>無法匯入</h2><p>這個分享連結不完整，請請對方重新傳一次。</p><div class="actions"><button class="btn" data-close>好</button></div>', "匯入"); return;
    }
    if(data.t === "b"){
      openSheet('<h2>匯入購買清單</h2><p>朋友分享了 '+data.i.length+' 樣要買的東西：</p><ul class="imp">'+data.i.slice(0,8).map(function(r){ return '<li>'+esc(String(r[0]))+'</li>'; }).join("")+(data.i.length>8?'<li>……共 '+data.i.length+' 樣</li>':'')+'</ul>'
        + '<p class="sub">會加到你的購買清單裡，已經有的同名項目會略過。</p><div class="actions"><button class="btn primary" id="imp_ok">加入我的清單</button><button class="btn" data-close>不用了</button></div>', "匯入");
      $("imp_ok").addEventListener("click", function(){
        var have = {}; BUY.items.forEach(function(i){ have[i.n+"|"+i.shop] = 1; });
        data.i.forEach(function(r){ var k = String(r[0])+"|"+String(r[4]||""); if(have[k]) return;
          addBuy(String(r[0]), String(r[4]||""), { qty: Math.max(1,toInt(r[1])||1), who: String(r[2]||""), price: toInt(r[3]), note: String(r[5]||"") }); });
        closeSheet(); setView("buy");
      });
    } else if(data.t === "p"){
      openSheet('<h2>匯入行李清單</h2><p>朋友分享了「'+esc(String(data.n||"行李清單"))+'」，共 '+data.i.length+' 樣。</p><p class="sub">會建立成一份新的行李清單。</p><div class="actions"><button class="btn primary" id="imp_ok">建立清單</button><button class="btn" data-close>不用了</button></div>', "匯入");
      $("imp_ok").addEventListener("click", function(){
        var l = { id: uid(), name: String(data.n||"行李清單"), type: data.ty==="domestic"?"domestic":"abroad", days: Math.max(1,toInt(data.d)||1),
                  addons: (data.a||[]).filter(function(a){ return ADDON[a]; }), items: [], created: Date.now() };
        data.i.forEach(function(r){ l.items.push({ id: uid(), c: CAT_ORDER.indexOf(r[0])>=0 ? r[0] : "其他", n: String(r[1]), q: Math.max(1,toInt(r[2])||1), done: false }); });
        PACKS.lists.push(l); savePacks(); packOpen = l.id; closeSheet(); setView("pack");
      });
    }
  }
  function inBuy(key){ return BUY.items.some(function(i){ return i.shop === key && !i.done; }); }

  syncModes(); renderAll(); updateDots(); setView(view); checkImport(); fxFetch();

  // Published copies of each mall's data file win over the embedded snapshot when newer.
  if(location.protocol.indexOf("http")===0){
    MALLS.forEach(function(m){
      fetch(m.id+".json",{cache:"no-store"}).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
        if(!d || !d.meta || !d.shops || dirty[m.id]) return;
        if(d.meta.updatedAt < DATA[m.id].meta.updatedAt) return;
        if(localMode[m.id]){ storeDel(localKey(m.id)); delete localMode[m.id]; }
        DATA[m.id] = d; renderFloorSel(); renderMeta(); renderBar(); render();
      }).catch(function(){});
    });
  }
  if(BUILD==="pwa" && "serviceWorker" in navigator && location.protocol==="https:"){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
})();
</script>

</body>
</html>
