<style>
/* Layout: station-signage list. Sticky header (mall tabs, search, filters), floor-grouped rows, elevator-plate badges per mall/area. */
:root{
  --bg:#eef2f8; --surface:#ffffff; --ink:#14213a; --muted:#5a6882; --line:#d8e0ec;
  --accent:#2f6fd6; --accent-ink:#ffffff; --accent-soft:#e3ecfb;
  --stellar-c:#1d3f86; --stellar-e:#0e7c7f; --apia-w:#6b3fa0; --apia-c:#9a5b00; --tokyu:#b3261e;
  --star:#d79a00; --warn-bg:#fff4dc; --warn-ink:#7a5200; --danger:#c0362c; --wing-ink:#ffffff;
  --f-display:"Barlow Condensed","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-ja:"Zen Kaku Gothic New","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","Zen Kaku Gothic New",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1322; --surface:#141e33; --ink:#e5ecf8; --muted:#94a3bd; --line:#253350;
  --accent:#6da5ff; --accent-ink:#0c1322; --accent-soft:#1b2a48;
  --stellar-c:#8eaeff; --stellar-e:#45c4c6; --apia-w:#c4a2f0; --apia-c:#f0b85a; --tokyu:#ff8a80;
  --star:#f2b928; --warn-bg:#3a2e12; --warn-ink:#f3d58f; --danger:#ff7b70; --wing-ink:#0c1322; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1322; --surface:#141e33; --ink:#e5ecf8; --muted:#94a3bd; --line:#253350;
  --accent:#6da5ff; --accent-ink:#0c1322; --accent-soft:#1b2a48;
  --stellar-c:#8eaeff; --stellar-e:#45c4c6; --apia-w:#c4a2f0; --apia-c:#f0b85a; --tokyu:#ff8a80;
  --star:#f2b928; --warn-bg:#3a2e12; --warn-ink:#f3d58f; --danger:#ff7b70; --wing-ink:#0c1322; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:8px}
.brand .mark{width:28px;height:28px;flex:none}
.brand h1{margin:0;min-width:0;font-family:var(--f-ja);font-weight:700;font-size:19px;line-height:1.2}
.brand h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:11.5px;color:var(--muted);margin-top:3px}
.brand .sp{flex:1}
.pill-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.pill-btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.malls{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.malls::-webkit-scrollbar{display:none}
.malls button{flex:none;border:0;background:none;padding:6px 10px 8px;font-size:14px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.malls button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.search{position:relative}
.search input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:var(--r);padding:11px 40px;font-size:16px}
.search input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:18px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip .n{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-size:13px;font-weight:500;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:13px}
.filters .fav-toggle{margin-left:auto}

.notice{display:flex;gap:8px;align-items:flex-start;background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r);padding:10px 12px;font-size:13px;margin-top:14px}
.meta-line{display:flex;justify-content:space-between;gap:4px 8px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin:14px 2px 4px}
.meta-line .count{font-variant-numeric:tabular-nums}

main{padding-bottom:120px}
.floor{margin-top:18px}
.floor-h{display:flex;align-items:baseline;gap:10px;padding:0 2px 6px;border-bottom:2px solid var(--ink)}
.floor-h .fl{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;letter-spacing:.01em}
.floor-h .hint{font-size:12.5px;color:var(--muted);min-width:0}
.floor-h .hint b{color:var(--ink);font-weight:700}
.floor-h .cnt{margin-left:auto;flex:none;font-family:var(--f-display);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.row .main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;display:flex;gap:12px;align-items:center}
.wing{flex:none;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--wing-ink)}
.wing.stellar-C{background:var(--stellar-c)} .wing.stellar-E{background:var(--stellar-e)}
.wing.apia-W{background:var(--apia-w)} .wing.apia-C{background:var(--apia-c)}
.wing.tokyu-{background:var(--tokyu);font-family:var(--f-ja);font-size:15px}
.names{min-width:0;flex:1}
.names>span{display:block}
.ja{font-family:var(--f-ja);font-weight:700;font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.alt{font-family:var(--f-ja);font-size:13px;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--muted);line-height:1.45;overflow-wrap:anywhere;margin-top:2px}
.tag{display:inline-block;font-size:11.5px;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 5px;margin-right:4px;font-weight:500}
.tag.temp{background:var(--warn-bg);color:var(--warn-ink)}
.tag.mall{background:transparent;border:1px solid var(--line);color:var(--muted)}
.star{flex:none;border:0;background:none;width:36px;height:36px;border-radius:50%;color:var(--line);font-size:20px;line-height:1}
.star[aria-pressed="true"]{color:var(--star)}
.edit-btn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13px}
.empty{padding:40px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.legend{display:grid;gap:8px;font-size:12.5px;color:var(--muted);margin-top:28px;padding:12px 2px;border-top:1px solid var(--line)}
.legend .item{display:flex;gap:8px;align-items:flex-start}
.legend .wing{width:20px;height:20px;font-size:12px;border-radius:5px;margin-top:1px}
.legend b{color:var(--ink)}
footer.foot{font-size:12.5px;color:var(--muted);padding:4px 2px 20px;display:flex;flex-direction:column;gap:4px}
footer.foot a{color:var(--accent)}
footer.foot .edit-row{margin-bottom:6px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:10px;box-shadow:0 -6px 20px rgba(10,20,40,.08)}
.bar .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .msg{flex:1;min-width:160px;font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}

.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(8,14,28,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px))}
@media (min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:16px}}
.sheet h2{margin:0 0 4px;font-family:var(--f-ja);font-size:20px;line-height:1.35;text-wrap:balance}
.sheet .plate{display:flex;gap:8px;align-items:center;margin:10px 0 14px;flex-wrap:wrap}
.sheet .plate .fl{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tel{font-variant-numeric:tabular-nums;user-select:all}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.actions a.btn{text-decoration:none;color:var(--ink)}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:16px;color:var(--ink)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .req::after{content:" *";color:var(--danger)}
.err{color:var(--danger);font-size:13px}
.confirm{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:10px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
@media (max-width:379px){.brand h1{font-size:17px}.brand .mark{width:24px;height:24px}#modes button{padding:6px 8px}}
</style>
</head>

<div id="app">

  <main class="wrap">
    <div id="notices"></div>
    <div class="meta-line"><span class="count" id="count"></span><span id="hours"></span></div>

    <div class="legend" id="legend"></div>

    </footer>
  </main>
  <div class="bar" id="bar" hidden>
    <div class="wrap">
      <div class="msg" id="barMsg"></div>
      <button class="btn" id="addBtn">＋ 新增店鋪</button>
      <button class="btn" id="exportBtn">匯出資料檔</button>
      <button class="btn primary" id="saveBtn">儲存</button>
      <button class="btn" id="doneBtn">結束編輯</button>
    </div>
  </div>
  <div class="sheet-bg" id="sheetBg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

    return s.replace(/[\s・･\-‐－ー—_.,'’&＆\/／()（）「」【】!！?？:：。、〈〉]+/g,"");
  }
  function haystack(s){
    var m = MALL[s._m];
    if(!s._h) s._h = norm([s.ja,s.en,s.zh,s.d,CAT_NAME[s.c],s.note,s.f,m.name,m.ja,m.areas&&m.areas[s.b]].join(" "));
    return s._h;
  }
  function esc(t){ return String(t==null?"":t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function floorRank(f){ var i = ALL_FLOORS.indexOf(f); return i<0?99:i; }
  function mallRank(id){ return MALLS.indexOf(MALL[id]); }
  function badge(s, extra){
    var txt = s._m==="tokyu" ? "東" : s.b;
    return '<span class="wing '+s._m+'-'+(s._m==="tokyu"?"":s.b)+(extra||"")+'" title="'+esc(areaName(s))+'">'+esc(txt)+'</span>';
  }
  function areaName(s){ var m = MALL[s._m]; return m.areas ? (m.areas[s.b]||s.b) : m.name; }

  function filtered(ignoreCat){
    var q = norm(state.q);
    return allShops().filter(function(s){
      if(!ignoreCat && state.cat!=="all" && s.c!==state.cat) return false;
      if(state.area!=="all" && s.b!==state.area) return false;
      if(state.floor!=="all" && s.f!==state.floor) return false;
      if(state.fav && !favs[favKey(s)]) return false;
      if(q && haystack(s).indexOf(q)<0) return false;
      return true;
    });
  }

  function names(s){
    var main, alt;
    if(state.mode==="ja"){ main = s.ja; alt = s.en; }
    else if(state.mode==="both"){ main = s.en || s.ja; alt = [s.en ? s.ja : "", s.zh].filter(Boolean).join("・"); }
    else { main = s.en || s.zh || s.ja; alt = (s.zh && s.zh!==main) ? s.zh : ""; }
    return { main: main, alt: alt };
  }

  // ---------- render ----------
  function renderMalls(){
    var tabs = [["all","全部商場"]].concat(MALLS.map(function(m){ return [m.id, m.name]; }));
    $("malls").innerHTML = tabs.map(function(t){
      return '<button data-mall="'+t[0]+'" aria-pressed="'+(state.mall===t[0])+'">'+esc(t[1])+'</button>';
    }).join("");
  }
  function renderAreas(){
    var m = MALL[state.mall], el = $("areas");
    if(!m || !m.areas){ el.hidden = true; state.area = "all"; return; }
    el.hidden = false;
    var opts = [["all","全區"]].concat(Object.keys(m.areas).map(function(k){ return [k, m.areas[k]]; }));
    el.innerHTML = opts.map(function(o){ return '<button data-a="'+o[0]+'" aria-pressed="'+(state.area===o[0])+'">'+esc(o[1])+'</button>'; }).join("");
  }
  function renderFloorSel(){
    var used = {}; allShops().forEach(function(s){ used[s.f]=1; });
    var fl = Object.keys(used).sort(function(a,b){ return floorRank(a)-floorRank(b) || (a<b?-1:1); });
    if(state.floor!=="all" && !used[state.floor]) state.floor = "all";
    $("floorSel").innerHTML = '<option value="all">全部樓層</option>' + fl.map(function(f){ return '<option value="'+esc(f)+'"'+(state.floor===f?" selected":"")+'>'+esc(f)+'</option>'; }).join("");
    $("floorSel").hidden = fl.length < 2;
  }
  function renderChips(){
    var base = filtered(true), n = {all:base.length};
    base.forEach(function(s){ n[s.c]=(n[s.c]||0)+1; });
    $("cats").innerHTML = CATS.map(function(c){
      return '<button class="chip" data-c="'+c[0]+'" aria-pressed="'+(state.cat===c[0])+'">'+c[1]+'<span class="n">'+(n[c[0]]||0)+'</span></button>';
    }).join("");
  }
  function rowHTML(s){
    var n = names(s);
    var intro = (s.note ? '<span class="tag temp">'+esc(s.note)+'</span>' : '')
      + (state.cat==="all" ? '<span class="tag">'+esc(CAT_NAME[s.c]||"")+'</span>' : '') + esc(s.d||"");
    return '<li class="row">'
      + '<button class="main" data-open="'+esc(favKey(s))+'">'+badge(s)
      + '<span class="names"><span class="ja">'+esc(n.main)+'</span>'
      + (n.alt ? '<span class="alt">'+esc(n.alt)+'</span>' : '')
      + '<span class="sub">'+intro+'</span></span></button>'
      + (state.edit ? '<button class="edit-btn" data-edit="'+esc(favKey(s))+'">修改</button>'
                    : '<button class="star" data-fav="'+esc(favKey(s))+'" aria-pressed="'+(!!favs[favKey(s)])+'" aria-label="收藏 '+esc(n.main)+'">★</button>')
      + '</li>';
  }
  function render(){
    renderChips();
    var list = filtered(false).sort(function(a,b){
      return mallRank(a._m)-mallRank(b._m) || floorRank(a.f)-floorRank(b.f) || (a.b<b.b?-1:a.b>b.b?1:0) || names(a).main.localeCompare(names(b).main,"ja");
    });
    var total = allShops().length;
    $("count").textContent = "顯示 " + list.length + " / " + total + " 間";
    if(!list.length){
      var why = state.fav && !Object.keys(favs).length ? "還沒有收藏的店。點店名旁的 ★ 加入收藏。" :
        state.q ? "找不到「"+state.q+"」。試試片假名、英文，或改選「全部商場」、「全部」分類。" : "這個條件下沒有店鋪。";
      $("results").innerHTML = '<div class="empty"><b>沒有符合的店鋪</b>'+esc(why)+'</div>';
      return;
    }
    var html = "", curKey = null, cur = null, buf = [];
    function flush(){
      if(!cur) return;
      var m = MALL[cur._m], hint = m.hints && m.hints[cur.f];
      var label = (state.mall==="all" ? '<b>'+esc(m.name)+'</b>' : '') + (hint ? (state.mall==="all"?"・":"")+esc(hint) : '');
      html += '<section class="floor"><div class="floor-h"><span class="fl">'+esc(cur.f)+'</span>'
        + (label ? '<span class="hint">'+label+'</span>' : '')
        + '<span class="cnt">'+buf.length+' 間</span></div><ul class="list">'+buf.map(rowHTML).join("")+'</ul></section>';
    }
    list.forEach(function(s){ var k = s._m+"|"+s.f; if(k!==curKey){ flush(); curKey=k; cur=s; buf=[]; } buf.push(s); });
    flush();
    $("results").innerHTML = html;
  }
  function shownMalls(){ return state.mall==="all" ? MALLS : [MALL[state.mall]]; }
  function renderMeta(){
    var ms = shownMalls();
    $("notices").innerHTML = ms.filter(function(m){ return DATA[m.id].meta.notice; }).map(function(m){
      return '<div class="notice" data-notice="'+m.id+'"><span aria-hidden="true">⚠</span><div>'+(ms.length>1?'<b>'+esc(m.name)+'</b>：':'')+esc(DATA[m.id].meta.notice)+'</div></div>';
    }).join("");
    $("hours").textContent = ms.length===1 ? (DATA[ms[0].id].meta.hours||"") : "";
    $("legend").innerHTML = ms.map(function(m){
      var keys = m.areas ? Object.keys(m.areas) : [""];
      return '<div class="item"><span>'+keys.map(function(k){ return badge({_m:m.id,b:k}); }).join(" ")+'</span><span><b>'+esc(m.name)+'</b>　'+esc(m.tip)
        + (m.areas ? '<br>'+keys.map(function(k){ return esc(m.areaTips[k]); }).join("／") : '')+'</span></div>';
    }).join("");
    $("srcLines").innerHTML = ms.map(function(m){
      var meta = DATA[m.id].meta;
      return '<div>'+esc(m.name)+'：資料更新 '+esc(meta.updated||"—")+(meta.edited?"（含手動修改）":"")+'｜<a href="'+m.map+'" target="_blank" rel="noopener">官方樓層地圖</a></div>';
    }).join("");
  }
  function renderBar(){
    var anyDirty = Object.keys(dirty).length>0, anyLocal = Object.keys(localMode).length>0;
    $("bar").hidden = !(state.edit || anyDirty || anyLocal);
    $("addBtn").hidden = !state.edit;
    $("doneBtn").hidden = !state.edit;
    var msg;
    if(anyDirty) msg = Object.keys(dirty).map(function(k){ return MALL[k].name; }).join("、") + " 有修改尚未儲存";
    else if(anyLocal) msg = "正在使用這台裝置上的修改版本";
    else msg = "編輯模式：點「修改」更正資料";
    $("barMsg").textContent = msg;
    $("saveBtn").disabled = !anyDirty;
  }
  function renderAll(){ renderMalls(); renderAreas(); renderFloorSel(); renderMeta(); renderBar(); render(); }

  // ---------- sheet ----------
  var lastFocus = null;
  function openSheet(html, label){
    lastFocus = document.activeElement;
    $("sheet").innerHTML = html; $("sheet").setAttribute("aria-label", label||"");
    $("sheetBg").hidden = false;
    var f = $("sheet").querySelector("input,button,select,textarea"); if(f) f.focus();
  }
  function closeSheet(){ $("sheetBg").hidden = true; $("sheet").innerHTML=""; if(lastFocus && lastFocus.focus) lastFocus.focus(); }
  function findShop(key){
    var i = key.indexOf(":"), m = key.slice(0,i), id = key.slice(i+1), arr = (DATA[m]||{}).shops||[];
    for(var j=0;j<arr.length;j++) if(arr[j].id===id){ arr[j]._m = m; return arr[j]; }
    return null;
  }
  function showDetail(key){
    var s = findShop(key); if(!s) return;
    var m = MALL[s._m], link = m.shopLink(s);
    openSheet(
      '<h2>'+esc(s.en || s.ja)+'</h2>'
      + '<div class="alt">'+esc([s.en ? s.ja : "", s.zh].filter(Boolean).join("・"))+'</div>'
      + (s.d ? '<p style="margin:10px 0 0">'+esc(s.d)+'</p>' : '')
      + '<div class="plate">'+badge(s)+'<span class="fl">'+esc(s.f)+'</span><span class="sub">'+esc(m.name)+(m.areas?'・'+esc(m.areas[s.b]||s.b):'')+'</span></div>'
      + '<dl class="dl"><dt>分類</dt><dd>'+esc(CAT_NAME[s.c]||s.c)+'</dd>'
      + (s.tel?'<dt>電話</dt><dd class="tel">'+esc(s.tel)+'</dd>':'')
      + (s.note?'<dt>備註</dt><dd>'+esc(s.note)+'</dd>':'')
      + '</dl><div class="actions">'
      + (link?'<a class="btn" href="'+link+'" target="_blank" rel="noopener">'+(m.shopLinkLabel||"官方店鋪頁")+'</a>':'')
      + '<button class="btn" data-fav="'+esc(key)+'" aria-pressed="'+(!!favs[key])+'">'+(favs[key]?"★ 已收藏":"☆ 收藏")+'</button>'
      + '<button class="btn" data-edit="'+esc(key)+'">修改資料</button>'
      + '<button class="btn" data-close>關閉</button></div>', s.ja);
  }
  function opt(v,label,cur){ return '<option value="'+esc(v)+'"'+(v===cur?" selected":"")+'>'+esc(label)+'</option>'; }
  function areaOptions(mid, cur){
    var m = MALL[mid];
    if(!m.areas) return opt("","（不分區）",cur);
    return Object.keys(m.areas).map(function(k){ return opt(k, m.areas[k], cur); }).join("");
  }
  function showEdit(key){
    var isNew = !key;
    var defMall = state.mall!=="all" ? state.mall : "stellar";
    var s = isNew ? {id:"",_m:defMall,b:MALL[defMall].areas?Object.keys(MALL[defMall].areas)[0]:"",f:MALL[defMall].floors[0],c:"fashion",ja:"",en:"",zh:"",d:"",tel:"",note:""} : findShop(key);
    if(!s) return;
    openSheet(
      '<h2>'+(isNew?"新增店鋪":"修改店鋪")+'</h2><p class="sub" style="margin:0 0 12px">改完按「套用」，再按下方「儲存」才會保存。</p>'
      + '<form class="form" id="editForm" novalidate>'
      + '<label>商場<select id="f_m"'+(isNew?'':' disabled')+'>'+MALLS.map(function(m){ return opt(m.id, m.name, s._m); }).join("")+'</select></label>'
      + '<label><span class="req">日文店名（官方寫法）</span><input id="f_ja" value="'+esc(s.ja)+'" required></label>'
      + '<div class="two"><label>品牌名（招牌寫法）<input id="f_en" value="'+esc(s.en)+'"></label><label>中文名<input id="f_zh" value="'+esc(s.zh)+'"></label></div>'
      + '<div class="two"><label>館區<select id="f_b">'+areaOptions(s._m, s.b)+'</select></label>'
      + '<label><span class="req">樓層</span><input id="f_f" value="'+esc(s.f)+'" placeholder="例：B1F、6F" required></label></div>'
      + '<label>分類<select id="f_c">'+CATS.slice(1).map(function(c){return opt(c[0],c[1],s.c);}).join("")+'</select></label>'
      + '<label>一句話介紹<input id="f_d" value="'+esc(s.d)+'" placeholder="例：北海道人氣迴轉壽司"></label>'
      + '<label>電話<input id="f_tel" value="'+esc(s.tel)+'" inputmode="tel"></label>'
      + '<label>備註（期間限定、改裝中等）<input id="f_note" value="'+esc(s.note)+'"></label>'
      + '<div class="err" id="f_err" hidden></div>'
      + '<div class="actions"><button type="submit" class="btn primary">套用</button><button type="button" class="btn" data-close>取消</button>'
      + (isNew?'':'<button type="button" class="btn danger" id="delAsk">刪除</button>')
      + '</div><div id="delZone"></div></form>', isNew?"新增店鋪":"修改店鋪");
    $("f_m").addEventListener("change", function(){ $("f_b").innerHTML = areaOptions(this.value, ""); });
    $("editForm").addEventListener("submit", function(e){
      e.preventDefault();
      var v = function(k){ return $("f_"+k).value.trim(); };
      var floor = v("f").toUpperCase().replace(/^B(\d)$/,"B$1F").replace(/^(\d+)$/,"$1F");
      if(!v("ja")){ showErr("請填寫店名。"); return; }
      if(!/^B?\d+F$/.test(floor)){ showErr("樓層請寫成 B1F 或 3F 的格式。"); return; }
      var mid = isNew ? v("m") : s._m;
      var rec = { id: isNew ? ("u"+Date.now().toString(36)) : s.id, b:v("b"), f:floor, c:v("c"), ja:v("ja"), en:v("en"), zh:v("zh"), d:v("d"), tel:v("tel") };
      if(v("note")) rec.note = v("note");
      var arr = DATA[mid].shops;
      if(isNew) arr.push(rec); else arr[arr.indexOf(s)] = rec;
      markDirty(mid); closeSheet(); renderFloorSel(); render();
    });
    var ask = $("delAsk");
    if(ask) ask.addEventListener("click", function(){
      $("delZone").innerHTML = '<div class="confirm">確定刪除「'+esc(s.ja)+'」？<button type="button" class="btn danger" id="delYes">刪除</button><button type="button" class="btn" id="delNo">保留</button></div>';
      $("delYes").addEventListener("click", function(){ var arr = DATA[s._m].shops; arr.splice(arr.indexOf(s),1); markDirty(s._m); closeSheet(); renderFloorSel(); render(); });
      $("delNo").addEventListener("click", function(){ $("delZone").innerHTML=""; });
    });
  }
  function showErr(t){ var e=$("f_err"); e.textContent=t; e.hidden=false; }
  function showNoticeEdit(mid){
    var m = MALL[mid], meta = DATA[mid].meta;
    openSheet('<h2>'+esc(m.name)+' 公告與營業時間</h2><form class="form" id="metaForm" novalidate>'
      + '<label>公告（留空則不顯示）<textarea id="m_notice" rows="3">'+esc(meta.notice||"")+'</textarea></label>'
      + '<label>營業時間<input id="m_hours" value="'+esc(meta.hours||"")+'"></label>'
      + '<div class="actions"><button type="submit" class="btn primary">套用</button><button type="button" class="btn" data-close>取消</button></div></form>', "公告");
    $("metaForm").addEventListener("submit", function(e){
      e.preventDefault(); meta.notice = $("m_notice").value.trim(); meta.hours = $("m_hours").value.trim();
      markDirty(mid); closeSheet(); renderMeta();
    });
  }
  function markDirty(mid){ dirty[mid] = true; renderBar(); }

  // ---------- saving ----------
  var hasClaude = !!(window.claude && window.claude.use);
  var artP = hasClaude ? window.claude.use("artifact").catch(function(){return null;}) : Promise.resolve(null);
  var dlP  = hasClaude ? window.claude.use("downloads").catch(function(){return null;}) : Promise.resolve(null);
  function setMsg(t){ $("barMsg").textContent = t; }
  function clean(mid){
    return JSON.stringify({ meta: DATA[mid].meta, shops: DATA[mid].shops.map(function(s){
      var o = {}; Object.keys(s).forEach(function(k){ if(k.charAt(0)!=="_") o[k]=s[k]; }); return o; }) }, null, 1);
  }
  function stamp(mid){
    var d = new Date(), p = function(n){return (n<10?"0":"")+n;};
    var meta = DATA[mid].meta;
    meta.updated = d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
    meta.updatedAt = d.toISOString(); meta.edited = true;
  }
  $("saveBtn").addEventListener("click", function(){
    var mids = Object.keys(dirty); if(!mids.length) return;
    this.disabled = true; setMsg("儲存中…");
    mids.forEach(stamp);
    artP.then(function(art){
      if(!art) throw {code:"no_artifact"};
      var files = {}; mids.forEach(function(mid){ files[mid+".json"] = {content: clean(mid), contentType:"application/json"}; });
      return art.publish(files);
    }).then(function(){
      mids.forEach(function(mid){ delete dirty[mid]; delete localMode[mid]; storeDel(localKey(mid)); });
      renderMeta(); renderBar(); setMsg("已儲存，在任何裝置打開這個頁面都會看到更新。");
    }).catch(function(err){
      var code = err && err.code;
      if(code==="conflict"){ setMsg("有人同時儲存了另一個版本，頁面會重新載入，請再做一次這次的修改。"); return; }
      mids.forEach(function(mid){ store(false, localKey(mid), clean(mid)); localMode[mid] = true; delete dirty[mid]; });
      renderMeta(); renderBar();
      setMsg(BUILD==="pwa"
        ? "已存在這台手機／電腦。要讓所有人看到，選好商場後按「匯出資料檔」，再上傳到 GitHub 取代同名檔案。"
        : "這裡無法發布修改（可能是唯讀分享），已先存在這台裝置的瀏覽器。");
    });
  });
  $("exportBtn").addEventListener("click", function(){
    if(state.mall==="all"){ setMsg("請先在上方選擇要匯出的商場。"); return; }
    var mid = state.mall, name = mid+".json", json = clean(mid);
    dlP.then(function(dl){
      if(dl) return dl.save({filename:name, data:json}).then(function(){ setMsg("已匯出 "+name+"。"); });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([json],{type:"application/json"})); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setMsg("已下載 "+name+"。上傳到 GitHub 取代同名檔案，所有人重新打開就會看到更新。");
    }).catch(function(err){ setMsg(err && err.code==="declined" ? "已取消匯出。" : "這裡無法下載檔案。"); });
  });

  // ---------- events ----------
  var qt;
  $("q").addEventListener("input", function(){ state.q = this.value; $("qClear").hidden = !this.value; clearTimeout(qt); qt = setTimeout(render, 60); });
  $("qClear").addEventListener("click", function(){ $("q").value=""; state.q=""; this.hidden=true; render(); $("q").focus(); });
  $("malls").addEventListener("click", function(e){
    var b=e.target.closest("[data-mall]"); if(!b) return;
    state.mall=b.dataset.mall; state.area="all"; state.floor="all"; store(false,MALL_KEY,state.mall);
    renderAll(); window.scrollTo({top:0});
  });
  $("cats").addEventListener("click", function(e){ var b=e.target.closest("[data-c]"); if(!b) return; state.cat=b.dataset.c; render(); });
  $("areas").addEventListener("click", function(e){
    var b=e.target.closest("[data-a]"); if(!b) return; state.area=b.dataset.a;
    Array.prototype.forEach.call(this.children,function(x){x.setAttribute("aria-pressed", String(x===b));}); render();
  });
  function syncModes(){ Array.prototype.forEach.call($("modes").children,function(x){x.setAttribute("aria-pressed", String(x.dataset.m===state.mode));}); }
  $("modes").addEventListener("click", function(e){ var b=e.target.closest("[data-m]"); if(!b) return; state.mode=b.dataset.m; store(false,MODE_KEY,state.mode); syncModes(); render(); });
  $("floorSel").addEventListener("change", function(){ state.floor=this.value; render(); });
  $("favToggle").addEventListener("click", function(){ state.fav=!state.fav; this.setAttribute("aria-pressed",String(state.fav)); render(); });
  $("editToggle").addEventListener("click", function(){
    state.edit=!state.edit; this.setAttribute("aria-pressed",String(state.edit)); this.textContent = state.edit?"結束編輯":"編輯資料";
    renderBar(); render(); if(state.edit) window.scrollTo({top:0});
  });
  $("doneBtn").addEventListener("click", function(){ $("editToggle").click(); });
  $("notices").addEventListener("click", function(e){ var n=e.target.closest("[data-notice]"); if(n && state.edit) showNoticeEdit(n.dataset.notice); });
  $("hours").addEventListener("click", function(){ if(state.edit && state.mall!=="all") showNoticeEdit(state.mall); });
  $("addBtn").addEventListener("click", function(){ showEdit(null); });
  function toggleFav(k){ if(favs[k]) delete favs[k]; else favs[k]=1; store(false, FAV_KEY, JSON.stringify(Object.keys(favs))); }
  document.addEventListener("click", function(e){
    var t;
    if((t=e.target.closest("[data-fav]"))){ toggleFav(t.dataset.fav); if(!$("sheetBg").hidden) showDetail(t.dataset.fav); render(); return; }
    if((t=e.target.closest("[data-edit]"))){ showEdit(t.dataset.edit); return; }
    if((t=e.target.closest("[data-open]"))){ showDetail(t.dataset.open); return; }
    if(e.target.closest("[data-close]") || e.target===$("sheetBg")){ closeSheet(); }
  });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape" && !$("sheetBg").hidden) closeSheet(); });

  syncModes(); renderAll();

  // Published copies of each mall's data file win over the embedded snapshot when newer.
  if(location.protocol.indexOf("http")===0){
    MALLS.forEach(function(m){
      fetch(m.id+".json",{cache:"no-store"}).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
